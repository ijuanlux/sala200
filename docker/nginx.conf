# SALA 200 — container nginx: serves the site, guards it with the session
# cookie and proxies the API (3011) and the netplay relay (3010).
user root;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_max_body_size 100m;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # valid members: one hash per line, generated by start.sh
    include /etc/nginx/sala200_map.conf;

    map $uri $sala_cache { default ""; ~\.html$ "no-cache"; }

    server {
        listen 8080 default_server;
        root /var/www/html;
        index index.html;
        charset utf-8;
        absolute_redirect off;

        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Permissions-Policy "gamepad=(self), fullscreen=(self), screen-wake-lock=(self)" always;
        add_header Cache-Control $sala_cache always;

        set $need_login 1;
        if ($sala_ok = 1) { set $need_login 0; }

        location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

        # login page and invitation sign-up: reachable without a session
        location = /juegos/login.html    { }
        location = /juegos/login.js      { }
        location = /juegos/registro.html { }
        location = /juegos/registro.js   { }
        location = /juegos/manifest.json { }
        location = /juegos/icon.png      { }
        location ^~ /juegos/fonts/       { }
        location = /api/registro         { proxy_pass http://127.0.0.1:3011/registro; proxy_set_header Host $host; }
        location = /api/registro-info    { proxy_pass http://127.0.0.1:3011/registro-info$is_args$args; proxy_set_header Host $host; }

        location = /juegos/games.json { add_header Cache-Control "no-cache" always; }

        # netplay
        location = /list {
            if ($need_login) { return 403; }
            proxy_pass http://127.0.0.1:3010/list$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /socket.io/ {
            if ($need_login) { return 403; }
            proxy_pass http://127.0.0.1:3010/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;
        }

        # profiles, ranking, invitations…
        location /api/ {
            if ($need_login) { return 403; }
            proxy_pass http://127.0.0.1:3011/;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $host;
        }

        location = / { return 302 /juegos/; }

        location / {
            if ($need_login) { return 302 /juegos/login.html?r=$request_uri; }
            try_files $uri $uri/ =404;
        }

        # your games, mounted from outside the container
        location /roms/ {
            if ($need_login) { return 403; }
            alias /roms/;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
    }
}
