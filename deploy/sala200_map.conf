map_hash_bucket_size 128;
map $cookie_sala200 $sala_ok {
    default 0;














}

# los HTML siempre se revalidan: si no, tras cada arreglo el navegador sigue con el viejo.
# (el resto de ficheros llevan ?v=N y pueden cachearse tranquilos)
map $uri $sala_cache {
    default        "";
    ~\.html$      "no-cache";
}
