server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080;
    listen [::]:8080;

    root /var/www/html;
    index index.html;
    server_name _;
    charset utf-8;
    absolute_redirect off;
    port_in_redirect off;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # permitimos explícitamente mandos, pantalla completa y vibración
    add_header Permissions-Policy "gamepad=(self), fullscreen=(self), screen-wake-lock=(self)" always;

    # ¿tiene sesión válida? (la cookie la valida el map de conf.d/sala200_map.conf)
    set $need_login 1;
    if ($sala_ok = 1) { set $need_login 0; }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # la pantalla de acceso y lo que necesita para pintarse: siempre accesible
    location = /juegos/login.html { }
    location = /juegos/login.js   { }
    location = /juegos/registro.html { }
    location = /juegos/registro.js   { }
    location = /juegos/manifest.json { }
    location = /juegos/icon.png   { }
    location ^~ /juegos/fonts/    { }

    # --- netplay (2 jugadores): socket.io necesita WebSockets ---
    # el cliente de netplay pide la lista de salas por HTTP aparte del socket.
    # Sin esto, "unirse a la partida de otro" no encontraba ninguna sala.
    location = /list {
        if ($need_login) { return 403; }
        proxy_pass http://127.0.0.1:3010/list$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
        if ($need_login) { return 403; }
        proxy_pass http://127.0.0.1:3010/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }
    location /netplay/ {
        if ($need_login) { return 403; }
        proxy_pass http://127.0.0.1:3010/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # --- perfiles, logros y ranking ---
    # las partidas guardadas de PS1 pesan decenas de MB: el limite de 1 MB
    # que trae nginx de serie las rechazaba antes de llegar al servicio
    client_max_body_size 100m;

    # el alta por invitacion ocurre ANTES de tener sesion
    location = /api/registro {
        proxy_pass http://127.0.0.1:3011/registro;
        proxy_set_header Host $host;
    }
    location = /api/registro-info {
        proxy_pass http://127.0.0.1:3011/registro-info$is_args$args;
        proxy_set_header Host $host;
    }

    location /api/ {
        if ($need_login) { return 403; }
        proxy_pass http://127.0.0.1:3011/;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    add_header Cache-Control $sala_cache always;

    # La web vive en /juegos/. Sin esto, quien abre la raiz ya con sesion se come
    # un 403 porque no hay nada que servir en /var/www/html.
    location = / {
        return 302 /juegos/;
    }

    location / {
        if ($need_login) { return 302 /juegos/login.html?r=$request_uri; }
        try_files $uri $uri/ =404;
    }

    # ROMs: nunca sin sesión
    location /roms/ {
        if ($need_login) { return 403; }
        alias /mnt/nasroms/;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
