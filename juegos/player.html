const FLOTANTES = ['emojiBtn', 'pantBtn', 'padFloat', 'stick', 'volverBtn', 'pesetaBtn'];
function idDe(el) {
  if (el.id && FLOTANTES.includes(el.id)) return 'f_' + el.id;     // micro, emojis, pantalla, mando
  if (el.classList.contains('ejs_virtualGamepad_left')) return 'dpad';
  const c = [...el.classList].find(x => x.startsWith('b_'));
  return c || null;
}
function elementos() {
  // todo lo que se puede recolocar: mando completo + los botones flotantes
  const zonaIzq = document.querySelector('.ejs_virtualGamepad_left');
  const flot = FLOTANTES.map(id => document.getElementById(id)).filter(Boolean);
  return [...document.querySelectorAll('.ejs_virtualGamepad_button'), zonaIzq, ...flot].filter(Boolean);
}
function fijar(el, x, y) {
  // lo sacamos de su contenedor: cualquier ancestro con transform desplazaría al botón
  if (el.parentElement && el.parentElement !== document.body) {
    if (!el._padre) { el._padre = el.parentElement; el._sig = el.nextElementSibling; }
    document.body.appendChild(el);
  }
  // con prioridad: el CSS del mando usa !important y si no, el botón salta a su sitio original
  const S = el.style;
  S.setProperty('position', 'fixed', 'important');
  S.setProperty('left', Math.round(x) + 'px', 'important');
  S.setProperty('top', Math.round(y) + 'px', 'important');
  S.setProperty('right', 'auto', 'important');
  S.setProperty('bottom', 'auto', 'important');
  S.setProperty('margin', '0', 'important');
  el.classList.add('sala-libre');
}
function soltarFijado(el) {
  ['position', 'left', 'top', 'right', 'bottom', 'margin'].forEach(p => el.style.removeProperty(p));
  el.classList.remove('sala-libre');
  // lo devolvemos a su sitio original
  if (el._padre) {
    try { el._padre.insertBefore(el, el._sig && el._sig.parentElement === el._padre ? el._sig : null); }
    catch (e) { el._padre.appendChild(el); }
    el._padre = null; el._sig = null;
  }
}
function aplicarPosiciones(forzar) {
  if (!TACTIL) return;                            // en PC no hay mando táctil que colocar
  if (arrastrando) return;                        // nunca mientras se arrastra
  elementos().forEach(el => {
    const id = idDe(el);
    if (!id || !posiciones[id]) return;
    if (!forzar && el.classList.contains('sala-libre')) return;   // ya colocado, no lo toques
    const p = posiciones[id];
    const w = el.offsetWidth || 60, h = el.offsetHeight || 60;
    let x = p.x * innerWidth, y = p.y * innerHeight;
    // red de seguridad: si el valor es raro lo metemos dentro de la pantalla,
    // pero NO lo borramos (borrarlo era justo lo que te destrozaba la configuración)
    if (!isFinite(x)) x = innerWidth * .5;
    if (!isFinite(y)) y = innerHeight * .5;
    x = Math.max(0, Math.min(innerWidth - w, x));
    y = Math.max(0, Math.min(innerHeight - h, y));
    fijar(el, x, y);
  });
}
function guardarPos(el) {
  const id = idDe(el);
  if (!id) return;
  const r = el.getBoundingClientRect();
  posTocadas = true;
  posiciones[id] = { x: r.left / innerWidth, y: r.top / innerHeight };
  localStorage.setItem(POSKEY(), JSON.stringify(posiciones));
  clearTimeout(window._gp); window._gp = setTimeout(guardarEnPerfil, 400);   // al perfil, sin agobiar
}

function barraColocar(mostrar) {
  let b = document.getElementById('colocarBar');
  if (!b && mostrar) {
    b = document.createElement('div');
    b.id = 'colocarBar';
    b.innerHTML = `<span>${TP.colocar}</span>
      <button id="colocarReset">RESET</button><button id="colocarOK">${TP.listo}</button>`;
    document.body.appendChild(b);
    b.querySelector('#colocarOK').onclick = () => setModo(false);
    b.querySelector('#colocarReset').onclick = () => {
      posiciones = {};
      Object.keys(localStorage).filter(k => k.startsWith('sala_padpos_')).forEach(k => localStorage.removeItem(k));
      fetch('/api/padlayout', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ borrar: true }) }).catch(() => {});
      elementos().forEach(soltarFijado);
      setModo(false);
    };
  }
  if (b) b.classList.toggle('on', !!mostrar);

function setModo(v) {

/* --- gestos --- */
function alPulsar(e) {
  if (!TACTIL) return;

  if (!el) return;

    e.preventDefault(); e.stopPropagation();
    const r = el.getBoundingClientRect();
    const pt = e.touches ? e.touches[0] : e;
    fijar(el, r.left, r.top);                     // se queda exactamente donde está

                    x0: pt.clientX, y0: pt.clientY, movido: false };

  if (Math.hypot(pt.clientX - arrastrando.x0, pt.clientY - arrastrando.y0) > 10) arrastrando.movido = true;
  const el = arrastrando.el;
  const w = el.offsetWidth, h = el.offsetHeight;
  fijar(el,
    Math.max(0, Math.min(innerWidth - w, pt.clientX - arrastrando.dx)),
    Math.max(0, Math.min(innerHeight - h, pt.clientY - arrastrando.dy)));
}
function alSoltar() {
  if (arrastrando) {
    const el = arrastrando.el, movido = arrastrando.movido;
    el.classList.remove('cogido');

    const esCruceta = el.id === 'stick' || el.classList.contains('ejs_virtualGamepad_left') ||

  ['touchstart', 'mousedown'].forEach(ev => f(ev, alPulsar, { capture: true, passive: false }));

      6: 12, 7: 12,                       // L2/R2 → Z
      9: 3,                               // Options → START
      12: 4, 13: 5, 14: 6, 15: 7 }        // cruceta

      4: 10, 5: 11, 6: 12, 7: 13,        // L1 R1 L2 R2
      8: 2, 9: 3,                        // Share→SELECT  Options→START
      12: 4, 13: 5, 14: 6, 15: 7 };      // cruceta

     [2, 21, 20, false], [3, 23, 22, false]]    // stick der → botones C

         pads.sort((a, b) => b.buttons.length - a.buttons.length)[0];

function leerMando() {
  if (!conMando) return;                     // sin mando real, ni tocamos getGamepads (60 veces/s)

  if (!p) return;

  const CON_RANURA = (sys === 'arcade' || sys === 'neogeo');
  for (const [btn, ctrl] of Object.entries(MAPA_BOTONES)) {
    const b = p.buttons[btn];
    const pulsado = b ? (typeof b === 'object' ? b.pressed : b === 1) : false;
    const clave = 'b' + btn;
    if (estado[clave] !== pulsado) {
      estado[clave] = pulsado;
      // en la recreativa, los gatillos L2/R2 son la ranura de monedas
      if (CON_RANURA && (btn === '6' || btn === '7')) {
        if (pulsado) echarMoneda();
        continue;
      }
      if (pulsado && CON_RANURA) monedaSiPrimera();
      try { em.gameManager.simulateInput(0, ctrl, pulsado ? 1 : 0); } catch (e) {}
    }
  }
  // SELECT + START mantenidos 1 s = salir al menú guardando (el modo sofá completo)
  const _sal = (p.buttons[8] && p.buttons[8].pressed) && (p.buttons[9] && p.buttons[9].pressed);
  if (_sal && !leerMando._combo) leerMando._combo = performance.now();
  else if (!_sal) leerMando._combo = 0;
  if (leerMando._combo && performance.now() - leerMando._combo > 1000 && !leerMando._saliendo) {
    leerMando._saliendo = true;
    toast(LANG === 'en' ? '👋 Saving and heading back…' : '👋 Guardando y volviendo al menú…', 2200);
    Promise.race([guardarPartida('salida'), new Promise(r => setTimeout(r, 2500))])
      .then(() => { location.href = 'index.html'; });
    return;
  }
  for (const [eje, ctrlNeg, ctrlPos, analog] of MAPA_EJES) {
    const v = p.axes[eje] || 0;
    const neg = v < -DZ ? (analog ? Math.round(32767 * -v) : 1) : 0;
    const pos = v > DZ ? (analog ? Math.round(32767 * v) : 1) : 0;
    if (estado['n' + eje] !== neg) { estado['n' + eje] = neg;
      try { em.gameManager.simulateInput(0, ctrlNeg, neg); } catch (e) {} }
    if (estado['p' + eje] !== pos) { estado['p' + eje] = pos;
      try { em.gameManager.simulateInput(0, ctrlPos, pos); } catch (e) {} }
  }
}
/* la lectura principal va enganchada al frame (ver el envoltorio de
   requestAnimationFrame); este intervalo lento es solo red de seguridad

setInterval(leerMando, 100);

/* EmulatorJS trae su PROPIO sondeo de mandos a 100 Hz (getGamepads + recorrer

   entero, y con mando evita el doble bucle y la doble inyección de botones. */

  const em = window.EJS_emulator;

  try { em.gamepad.terminate(); } catch (e) {}

}, 1500);

/* diagnóstico del mando: qué ve el navegador de verdad */
function diag() {

  const el = document.getElementById('padDiag');
  if (!el) return;

  const seguro = window.isSecureContext ? 'SÍ' : 'NO';
  const api = navigator.getGamepads ? 'SÍ' : 'NO';

  try { permitido = document.featurePolicy ? (document.featurePolicy.allowsFeature('gamepad') ? 'SÍ' : 'NO') : '?'; } catch (e) {}
  const modo = matchMedia('(display-mode: standalone)').matches ? 'APP'
             : matchMedia('(display-mode: fullscreen)').matches ? 'APP-FS' : 'PESTAÑA';
  let txt = `${modo} · ${location.hostname}<br>HTTPS: ${seguro} · API: ${api} · PERMISO: ${permitido} · MANDOS: ${pads.length}`;
  const p = padReal();
  if (p) {

    const em = window.EJS_emulator;
    const asig = em && Array.isArray(em.gamepadSelection) ? (em.gamepadSelection[0] ? 'SÍ' : 'NO') : '?';
    const fantasmas = pads.length - 1;
    txt += `<br>${p.id.slice(0, 30)} · ranura ${p.index} · ${p.mapping === 'standard' ? 'estándar' : 'mapeo raro'} · ${p.buttons.length} botones` +
           (fantasmas > 0 ? ` · ${fantasmas} fantasma${fantasmas > 1 ? 's' : ''} ignorado${fantasmas > 1 ? 's' : ''}` : '') +
           `<br>asignado a J1: ${asig} · botón: ${pulsado >= 0 ? pulsado : '—'}`;
  } else if (pads.length) {
    txt += `<br>solo veo dispositivos sin botones (fantasmas): ${pads.map(x => x.id.slice(0, 20)).join(' · ')}`;
  } else {

/* ---------- MAPEO DEL MANDO (DualSense y compatibles) ----------
   Índices de EmulatorJS: 0=B 1=Y 2=SELECT 3=START 4..7=cruceta 8=A 9=X 10=L 11=R 12=L2 13=R2
   En N64 cambian: 0=A 1=B 3=START 10=L 11=R 12=Z 16..19=stick 20..23=botones C           */
const K = (t, g) => ({ value: t, value2: g });

  4: K('up arrow', 'DPAD_UP'), 5: K('down arrow', 'DPAD_DOWN'),

  1: K('a', 'BUTTON_3'),                 // Y  ← ▢
  9: K('s', 'BUTTON_4'),                 // X  ← △
  10: K('q', 'LEFT_TOP_SHOULDER'),       // L  ← L1
  11: K('e', 'RIGHT_TOP_SHOULDER'),      // R  ← R1
  12: K('tab', 'LEFT_BOTTOM_SHOULDER'),  // L2 ← L2
  13: K('r', 'RIGHT_BOTTOM_SHOULDER'),   // R2 ← R2
  2: K('v', 'SELECT'),                   // SELECT ← Share
  3: K('enter', 'START'),                // START  ← Options

  1: K('z', 'BUTTON_2'),                       // B ← ○
  3: K('enter', 'START'),                      // START ← Options
  10: K('q', 'LEFT_TOP_SHOULDER'),             // L ← L1
  11: K('e', 'RIGHT_TOP_SHOULDER'),            // R ← R1
  12: K('space', 'LEFT_BOTTOM_SHOULDER'),      // Z ← L2 (el gatillo trasero del N64)
  19: K('w', 'LEFT_STICK_Y:-1'),               // stick arriba
  18: K('s', 'LEFT_STICK_Y:+1'),               // stick abajo
  17: K('a', 'LEFT_STICK_X:-1'),               // stick izquierda
  16: K('d', 'LEFT_STICK_X:+1'),               // stick derecha
  23: K('i', 'RIGHT_STICK_Y:-1'),              // C arriba
  22: K('k', 'RIGHT_STICK_Y:+1'),              // C abajo
  21: K('j', 'RIGHT_STICK_X:-1'),              // C izquierda
  20: K('l', 'RIGHT_STICK_X:+1'),              // C derecha

    pcsx_rearmed_pad1type: 'analog',
    pcsx_rearmed_pad2type: 'analog'
  });
}

  if (typeof sys !== 'undefined' && sys === 'psx') {
    try {
      const r = await fetch('/roms/PSX/scph1001.bin', { method: 'HEAD' });
      if (r.ok) {
        window.EJS_biosUrl = '/roms/PSX/scph1001.bin';
        console.log('[sala200] BIOS de PS1 encontrada, usándola');
      } else {
        console.log('[sala200] sin BIOS de PS1: el núcleo usará la interna (algún juego puede fallar)');
      }
    } catch (e) {}
  }
  /* Arcade: el romset es de una versión vieja de MAME, así que cada juego va
     con un núcleo distinto. La sala lo APRENDE: si un jugador consigue que
     arranque con uno, los demás entran ya con ese; si falla, se prueba el
     siguiente y se apunta. */
  const arrancar = () => {
    const sc = document.createElement('script');
    sc.src = 'ejs/loader.js';
    document.body.appendChild(sc);
  };
  if ((sys === 'arcade' || sys === 'neogeo') && !p.get('core')) {
    const t0 = setTimeout(arrancar, 1500);          // si la API tarda, no esperamos
    fetch('/api/romstat?rom=' + encodeURIComponent(p.get('rom') || ''))
      .then(r => r.json()).then(d => {
        if (d && d.dato && d.dato.ok && d.dato.core) window.EJS_core = d.dato.core;
      }).catch(() => {}).finally(() => { clearTimeout(t0); arrancar(); });
  } else {
    arrancar();
  }
  window.EJS_coreUsado = window.EJS_core;
})();
</script>
