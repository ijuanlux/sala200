<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#030503">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="pad.css?v=26">
<title>SALA 200</title>
<style>
  @font-face { font-family: 'PS2P'; src: url('fonts/pressstart2p.ttf') format('truetype'); font-display: swap; }
  :root { --ph: #39ff88; --cy: #35e9ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100dvh; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
  body { background: #030503; margin: 0; display: flex; flex-direction: column;
    font-family: ui-monospace, Menlo, monospace; }
  #top { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 2px solid #1a3324;
    background: #020703; flex-wrap: nowrap; }
  #top a, #top button { font-family: 'PS2P'; font-size: 10px; color: var(--cy); text-decoration: none;
    background: none; border: 1px solid #1a3324; padding: 8px 10px; cursor: pointer; white-space: nowrap; }
  #top a:hover, #top button:hover { color: var(--ph); border-color: var(--ph); }
  #title { font-family: 'PS2P'; font-size: 10px; color: #6fa585; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 1; min-width: 0; }
  #hint { font-size: 9px; color: #2c5540; letter-spacing: .1em; white-space: nowrap; }
  #game { flex: 1; min-height: 0; }
  /* pantalla completa "a la brava" para iOS, que no soporta la API en divs */
  body.fs #top { display: none; }
  body.fs { height: 100dvh; }
  body.fs { --fs-drop: max(1.2dvh, env(safe-area-inset-top)); }
  /* el recorte va en el contenedor del lienzo, NO en #game (ahí vive también el mando) */
  body[data-pantalla="rellenar"] .ejs_canvas_parent,
  body[data-pantalla="estirar"] .ejs_canvas_parent { overflow: hidden !important; }
  body.fs #game { position: fixed; left: 0; right: 0; top: var(--fs-drop); width: 100vw;
    height: calc(100dvh - var(--fs-drop)); z-index: 9999; }
  body.fs #padPanel { bottom: auto; top: 50%; transform: translate(-50%, -50%); z-index: 10005;
    flex-wrap: wrap; justify-content: center; max-width: 92vw; }
  @media (max-width: 820px) { #hint { display: none; } }
  #padPanel { position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%); z-index: 10000;
    background: rgba(3,10,6,.93); border: 2px solid #1a3324; padding: 16px 20px; display: none;
    align-items: center; gap: 14px; }
  #padPanel.on { display: flex; }
  #padPanel span { font-family: 'PS2P'; font-size: 9px; color: var(--cy); white-space: nowrap; }
  #padPanel input { width: 190px; accent-color: #39ff88; }
  #padPanel button { font-family: 'PS2P'; font-size: 9px; background: none; border: 1px solid #1a3324;
    color: var(--ph); padding: 8px 10px; }
  /* en pantalla completa la barra de arriba desaparece: este acceso queda flotando */
  #padFloat { position: fixed; z-index: 10004; display: none;
    left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top));
    width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(57,255,136,.45);
    background: rgba(3,10,6,.55); color: #39ff88; font-size: 17px; line-height: 1;
    opacity: .35; cursor: pointer; transition: opacity .2s, transform .15s; }
  #padFloat:hover, #padFloat:active { opacity: 1; transform: scale(1.08); }
  body.fs #padFloat { display: block; }
  body.colocando #padFloat { display: none; }
  /* --- emojis: un solo cartel ligero, nada de lluvia (comía fotogramas en red) --- */
  #emoBadge { position: fixed; pointer-events: none; z-index: 10007; left: 50%; top: 12%;
    transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
    background: rgba(3,10,6,.88); border: 2px solid #ffd23f; padding: 8px 14px;
    animation: subeEmo 2.4s ease forwards; }
  #emoBadge .e { font-size: 34px; line-height: 1; }
  #emoBadge b { font-family: 'PS2P'; font-size: 10px; color: #ffe9a8; }
  @keyframes subeEmo { 0%{opacity:0;transform:translateX(-50%) translateY(10px)}
    15%{opacity:1;transform:translateX(-50%) translateY(0)}
    80%{opacity:1} 100%{opacity:0;transform:translateX(-50%) translateY(-14px)} }
  #emojiBtn { position: fixed; z-index: 10008; right: max(8px, env(safe-area-inset-right));
    top: max(8px, env(safe-area-inset-top)); width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid rgba(255,210,63,.5); background: rgba(3,10,6,.55); font-size: 19px;
    opacity: .4; cursor: pointer; transition: opacity .2s, transform .15s; }
  #emojiBtn:hover, #emojiBtn:active { opacity: 1; transform: scale(1.08); }
  #emojiFila { position: fixed; z-index: 10008; right: max(8px, env(safe-area-inset-right));
    top: calc(max(8px, env(safe-area-inset-top)) + 148px); display: none; flex-wrap: wrap;
    width: 212px; gap: 4px; background: rgba(3,10,6,.94); border: 2px solid #1a3324; padding: 8px; }
  #emojiFila.on { display: flex; }
  #emojiFila { max-height: min(72vh, 480px); overflow-y: auto; overscroll-behavior: contain; }
  #emojiFila button { width: 36px; height: 36px; font-size: 20px; background: none; border: 1px solid #1a3324;
    cursor: pointer; }
  #emojiFila button:active { background: #102117; }
  #emojiFila .sep { width: 100%; height: 1px; background: #1a3324; margin: 4px 0; }
  #emojiFila button.frase { width: 100%; height: auto; font-family: 'PS2P'; font-size: 8px;
    color: #ffd23f; text-align: left; padding: 9px 8px; line-height: 1.5; letter-spacing: .04em; }
  #emojiFila button.frase:active { background: #241a02; }
  #emoBadge.frase { border-color: #ff2d55; flex-direction: column; gap: 4px; padding: 10px 16px;
    max-width: min(88vw, 480px); text-align: center; }
  #emoBadge.frase b { font-size: 12px; color: #ffd8de; line-height: 1.6; }
  #emoBadge.frase i { font-style: normal; font-family: 'PS2P'; font-size: 8px; color: #ff2d55; }
  body.colocando #emojiFila { display: none; }
  body.colocando #emojiBtn, body.colocando #pantBtn,
  body.colocando #padFloat, body.colocando #volverBtn, body.colocando #pesetaBtn {
    display: block !important; opacity: .95 !important;
    outline: 2px dashed #35e9ff; outline-offset: 3px;
  }
  /* --- la moneda de 25 pesetas: INSERT COIN de recreativa --- */
  #pesetaBtn { position: fixed; z-index: 10008; left: max(10px, env(safe-area-inset-left));
    bottom: 44%; width: 58px; height: 58px; border-radius: 50%; cursor: pointer; padding: 0;
    font-family: 'PS2P'; color: #4a3505; line-height: 1.2; text-align: center;
    background: radial-gradient(circle at 32% 28%, #fff3c4 0%, #f5c842 42%, #c89a2a 78%, #8a6a1c 100%);
    border: 3px double #8a6a1c;
    box-shadow: 0 2px 9px rgba(0,0,0,.55), inset 0 0 7px rgba(255,255,255,.4);
    opacity: .9; transition: transform .12s, opacity .2s; user-select: none; }
  #pesetaBtn b { display: block; font-size: 16px; }
  #pesetaBtn i { display: block; font-style: normal; font-size: 6px; letter-spacing: .12em; }
  #pesetaBtn:hover { opacity: 1; }
  #pesetaBtn:active { transform: scale(.86); opacity: 1; }
  #pesetaBtn.echada { animation: monedaCae .45s ease; }
  @keyframes monedaCae { 35% { transform: translateY(16px) scale(.8) rotate(18deg); } }
  /* --- modo red: interfaz mínima. Fuera todo lo que desincronice o robe frames --- */
  body.enred #pantMenu button[data-a="guardar"], body.enred #pantMenu button[data-a="auto"],
  body.enred #pantMenu button[data-a="cero"], body.enred #pantMenu button[data-a="fuego"],
  body.enred #pantMenu button[data-a="giro"], body.enred #pmTitPartida { display: none; }
  /* y en red también sobran el botón de instalar la app y el de tamaño del mando */
  body.enred #instBtn, body.enred #padFloat { display: none !important; }
  /* en el palco solo se mira: fuera mandos y botones de jugar */
  html.palco .ejs_virtualGamepad_parent, html.palco .ejs_virtualGamepad_button,
  html.palco .ejs_virtualGamepad_left, html.palco #stick, html.palco #padFloat,
  html.palco #pesetaBtn, html.palco #emojiBtn, html.palco #emojiFila,
  html.palco #padBtn, html.palco #padPanel { display: none !important; }
  /* pregunta de duelo al acabar una partida en red */
  #dueloBox { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 10010; background: rgba(3, 10, 6, .96); border: 2px solid #ffd23f; padding: 13px 16px;
    display: none; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    font-family: 'PS2P'; font-size: 9px; color: #ffe9a8; max-width: 94vw; }
  #dueloBox.on { display: flex; }
  #dueloBox button { font-family: 'PS2P'; font-size: 9px; background: none; border: 2px solid #ffd23f;
    color: #ffd23f; padding: 11px 12px; cursor: pointer; }
  #dueloBox button:hover { background: #ffd23f; color: #201800; }
  #dueloBox button.paso { border-color: #1a3324; color: #6fa585; }
  /* el resincronizar solo tiene sentido EN red */
  #pmResync { display: none; }
  body.enred #pmResync { display: block; }
  /* --- con mando físico conectado, los controles táctiles sobran: menos capas que componer --- */
  body.conmando .ejs_virtualGamepad_parent, body.conmando .ejs_virtualGamepad_button,
  body.conmando .ejs_virtualGamepad_left, body.conmando #stick, body.conmando #padFloat {
    display: none !important;
  }
  /* --- monitor: ajustes de pantalla --- */
  #pantBtn { position: fixed; z-index: 10008; right: max(8px, env(safe-area-inset-right));
    top: calc(max(8px, env(safe-area-inset-top)) + 100px); width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid rgba(184,152,255,.5); background: rgba(3,10,6,.55); font-size: 18px;
    opacity: .4; cursor: pointer; transition: opacity .2s, transform .15s; }
  #pantBtn:hover, #pantBtn:active { opacity: 1; transform: scale(1.08); }
  /* Con catorce opciones una sola columna no cabía en pantalla. En rejilla queda
     cuadradito y entra todo; si aun así no cabe, se puede rodar con el dedo. */
  #pantMenu { position: fixed; z-index: 10008; right: max(8px, env(safe-area-inset-right));
    top: calc(max(8px, env(safe-area-inset-top)) + 52px); display: none;
    grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px;
    width: min(420px, calc(100vw - 24px));
    max-height: calc(100dvh - max(8px, env(safe-area-inset-top)) - 74px);
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    background: rgba(3,10,6,.96); border: 2px solid #1a3324; padding: 9px; }
  #pantMenu.on { display: grid; }
  #pantMenu .pm-t { grid-column: 1 / -1; font-family: 'PS2P'; font-size: 8px; color: #b898ff;
    letter-spacing: .2em; margin-bottom: 2px; position: sticky; top: -9px;
    background: rgba(3,10,6,.96); padding: 4px 0; z-index: 2; }
  #pantMenu button { text-align: left; background: none; border: 1px solid #1a3324; color: #d8ffe8;
    font-family: 'PS2P'; font-size: 8.5px; padding: 9px 8px; cursor: pointer; line-height: 1.45;
    border-radius: 4px; }
  #pantMenu button span { display: block; font-family: ui-monospace, monospace; font-size: 8px;
    color: #3d5c49; margin-top: 3px; }
  /* los de pantalla completa y ajustar ocupan las dos columnas, que son los gordos */
  #pantMenu button[data-a="marco"], #pantMenu button[data-a="fs"] { grid-column: 1 / -1; }
  #pantMenu .pm-sep { grid-column: 1 / -1; }
  @media (max-width: 430px) { #pantMenu { width: calc(100vw - 20px); font-size: 8px; } }
  /* tumbado sobra ancho y falta alto: tres columnas y entra todo sin rodar */
  @media (orientation: landscape) {
    #pantMenu { width: min(660px, calc(100vw - 24px)); grid-template-columns: repeat(3, minmax(0, 1fr));
      top: max(6px, env(safe-area-inset-top)); max-height: calc(100dvh - 14px); }
    #pantMenu button { padding: 7px 7px; }
    #pantMenu button span { margin-top: 2px; }
    #pantMenu .pm-t { top: -9px; padding: 3px 0; }
    #pantMenu button[data-a="marco"], #pantMenu button[data-a="fs"] { grid-column: auto; }
  }
  #pantMenu button.on { border-color: #b898ff; color: #b898ff; }
  #pantMenu button:active { background: #102117; }
  #pantMenu .pm-sep { height: 1px; background: #102117; margin: 4px 0; }
  body.colocando #pantMenu { display: none; }
  /* --- marco ajustable de la pantalla --- */
  #marcoCaja { position: fixed; z-index: 10008; display: none; border: 3px dashed #b898ff;
    background: rgba(184,152,255,.06); cursor: move; touch-action: none; user-select: none; }
  /* con el marco abierto, el mando se aparta para no robar los toques */
  body:has(#marcoCaja[style*="display: block"]) .ejs_virtualGamepad_parent { pointer-events: none; opacity: .25; }
  #marcoCaja .mh { position: absolute; width: 40px; height: 40px; background: rgba(3,10,6,.92);
    border: 3px solid #b898ff; touch-action: none; border-radius: 6px; }
  #marcoCaja .mh::after { content: ''; position: absolute; inset: 8px; border: 2px solid rgba(184,152,255,.5); }
  #marcoCaja .nw { left: -20px; top: -20px; cursor: nwse-resize; }
  #marcoCaja .ne { right: -20px; top: -20px; cursor: nesw-resize; }
  #marcoCaja .sw { left: -20px; bottom: -20px; cursor: nesw-resize; }
  #marcoCaja .se { right: -20px; bottom: -20px; cursor: nwse-resize; }
  #marcoCaja .mtxt { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-family: 'PS2P'; font-size: 9px; color: #b898ff; white-space: nowrap; opacity: .8; }
  #marcoBar { position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top));
    transform: translateX(-50%) translateY(-30px); z-index: 10020; background: rgba(3,10,6,.96);
    border: 2px solid #b898ff; color: #e5daff; font-family: 'PS2P'; font-size: 9px;
    padding: 10px 12px; display: flex; align-items: center; gap: 10px;
    opacity: 0; transition: opacity .25s, transform .25s; }
  #marcoBar.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #marcoBar button { font-family: 'PS2P'; font-size: 10px; background: none; border: 2px solid #b898ff;
    color: #b898ff; padding: 11px 14px; cursor: pointer; pointer-events: auto; }
  #marcoBar button:hover { background: #b898ff; color: #1a1030; }
  #httpsWarn { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(30px);
    z-index: 10002; background: rgba(20,6,6,.96); border: 2px solid #ff2d55; color: #ffd8de;
    font-size: 12px; line-height: 1.7; padding: 14px 18px; text-align: center; max-width: min(92vw, 460px);
    opacity: 0; transition: opacity .3s, transform .3s; }
  #httpsWarn.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* el aviso no debe robar toques a los botones que tiene debajo (START y SELECT) */
  #httpsWarn { pointer-events: none; }
  #httpsWarn a { pointer-events: auto; }
  body.colocando #httpsWarn { display: none; }
  #httpsWarn a { display: block; margin-top: 10px; color: #39ff88; font-family: 'PS2P'; font-size: 10px; }
  #npBar { position: fixed; left: 50%; top: 12px; transform: translateX(-50%) translateY(-24px);
    z-index: 10003; background: rgba(3,10,6,.94); border: 2px solid #1a3324; color: #d8ffe8;
    font-family: 'PS2P'; font-size: 10px; line-height: 1.9; padding: 12px 18px; text-align: center;
    max-width: min(94vw, 560px); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #npBar.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* La barra no recibe toques para no estorbar jugando, PERO sus botones sí:
     sin esto el dedo atravesaba el botón y el móvil se ponía a seleccionar texto. */
  #npBar button { pointer-events: auto !important; touch-action: manipulation;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    min-height: 44px; font-size: 11px !important; padding: 12px 18px !important; }
  #npBar button:active { transform: scale(.96); }
  #npBar.wait { border-color: #ffd23f; color: #ffe9a8; }
  #npBar.go { border-color: #39ff88; color: #d8ffe8; box-shadow: 0 0 34px rgba(57,255,136,.25); }
  #npBar b { color: #39ff88; }
  #npBar .dots::after { content: ''; animation: np 1.4s steps(4) infinite; }
  @keyframes np { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
  /* ---- volver al menú, discreto, siempre a mano ---- */
  #volverBtn { position: fixed; z-index: 10006; display: none;
    left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top));
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(216,255,232,.32);
    background: rgba(3,10,6,.42); color: #d8ffe8; font-size: 17px; line-height: 40px;
    text-align: center; cursor: pointer; opacity: .3;
    transition: opacity .25s, transform .15s, background .25s; padding: 0; }
  #volverBtn:active { transform: scale(.9); }
  #volverBtn.on { display: block; }
  #volverBtn.listo { opacity: .95; background: rgba(255,45,85,.85); border-color: #ff2d55; }
  body.colocando #volverBtn { opacity: .95; }

  /* ---- racha de especiales, estilo marcador de recreativa ---- */
  #comboBox { position: fixed; z-index: 10009; left: 50%; transform: translateX(-50%) scale(.7);
    top: max(58px, calc(env(safe-area-inset-top) + 52px)); pointer-events: none;
    text-align: center; opacity: 0; transition: opacity .18s, transform .18s cubic-bezier(.2,1.6,.4,1); }
  #comboBox.on { opacity: 1; transform: translateX(-50%) scale(1); }
  #comboBox b { display: block; font-family: 'PS2P'; font-size: 30px; line-height: 1;
    color: #ffd23f; text-shadow: 0 0 18px rgba(255,150,40,.9), 0 3px 0 #7a2b00; }
  #comboBox i { display: block; font-style: normal; font-family: 'PS2P'; font-size: 9px;
    margin-top: 7px; letter-spacing: .16em; color: #ffb060; text-shadow: 0 0 12px rgba(255,120,0,.8); }
  #comboBox.n5 b, #comboBox.n6 b { color: #ff8a3d; text-shadow: 0 0 24px rgba(255,90,20,1), 0 3px 0 #6b1500; }
  #comboBox.n7 b, #comboBox.n8 b { color: #9fd8ff; text-shadow: 0 0 26px rgba(80,170,255,1), 0 3px 0 #06294f; }
  #comboBox.n7 i, #comboBox.n8 i { color: #bfe6ff; }
  #comboBox.n9 b, #comboBox.n10 b { color: #ffffff; font-size: 38px;
    text-shadow: 0 0 30px #fff, 0 0 60px rgba(120,200,255,1), 0 4px 0 #04203d;
    animation: comboLate .28s ease-in-out infinite alternate; }
  #comboBox.n9 i, #comboBox.n10 i { color: #fff; font-size: 10px; }
  @keyframes comboLate { from { transform: scale(1); } to { transform: scale(1.12); } }

  /* el mando tiembla cuando la cosa se pone seria */
  #stick.temblando { animation: temblor .09s steps(2) infinite; }
  #stick.temblandoMucho { animation: temblorGordo .06s steps(2) infinite; }
  /* transform, no margin: el margen recoloca (layout) en cada sacudida */
  @keyframes temblor { from { transform: translateX(-1px); } to { transform: translateX(1px); } }
  @keyframes temblorGordo { 0% { transform: translate(-2px, -1px); }
    50% { transform: translate(2px, 1px); } 100% { transform: translate(-1px, 2px); } }

  /* ---- joystick que sustituye a la cruceta ---- */
  #stick { position: fixed; z-index: 10002; display: none; touch-action: none; user-select: none;
    width: var(--sala-dpad, 170px); height: var(--sala-dpad, 170px);
    left: max(12px, env(safe-area-inset-left));
    bottom: calc(var(--pill-h, 48px) + max(14px, env(safe-area-inset-bottom))); }
  html.stick-on #stick { display: block; }
  html.stick-on .ejs_dpad_main { display: none !important; }
  /* el contenedor de la cruceta se queda invisible pero sigue existiendo:
     si no lo desactivamos, se traga los toques del joystick */
  html.stick-on .ejs_virtualGamepad_left { pointer-events: none !important; opacity: 0 !important; }
  /* sin aro y casi transparente: solo se insinúa, y despierta al tocarla */
  #stickBase { position: absolute; inset: 8%; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.14);
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.05), rgba(8,12,18,.22) 70%, transparent 100%);
    opacity: .38; transition: opacity .25s, border-color .25s; }
  /* bola de recreativa: la textura se dibuja al vuelo (arañazos, desconchones y roña) */
  #stickKnob { position: absolute; left: 50%; top: 50%; width: 44%; height: 44%;
    margin: -22% 0 0 -22%; border-radius: 50%;
    background-size: cover; background-position: center;
    box-shadow: 0 7px 18px rgba(0,0,0,.6), 0 2px 4px rgba(0,0,0,.5),
                inset 0 -6px 12px rgba(0,0,0,.45);
    transition: transform .09s ease-out;
    will-change: transform; }   /* capa propia: la textura y sombras se pintan UNA vez y moverla es gratis */
  #stick.agarrado #stickKnob { box-shadow: 0 4px 10px rgba(0,0,0,.65),
    inset 0 -5px 10px rgba(0,0,0,.5), 0 0 22px rgba(255,120,60,.35); }
  /* mientras la bola está en llamas, se pone al rojo (o al azul) y late */
  #stickKnob::after { content: ''; position: absolute; inset: -45%; border-radius: 50%;
    pointer-events: none; opacity: 0; will-change: opacity, transform;

/* ---------- pantalla completa ----------
   Chrome/Android/escritorio: API nativa → desaparece TODO el navegador.
   iOS (Safari y Chrome, ambos WebKit): la API no existe para divs → modo "a la brava". */
const UA = navigator.userAgent;
const PLAT = (() => {
  const ios = /iP(hone|ad|od)/.test(navigator.platform) ||
              (UA.includes('Mac') && navigator.maxTouchPoints > 1);
  const android = /Android/.test(UA);
  const standalone = !!navigator.standalone || matchMedia('(display-mode: standalone)').matches
                     || matchMedia('(display-mode: fullscreen)').matches;
  const chrome = /Chrome|CriOS/.test(UA) && !/Edg|OPR/.test(UA);
  const firefox = /Firefox|FxiOS/.test(UA);
  const canFS = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  // en iOS ningún navegador puede: todos son WebKit por obligación de Apple
  const trueFS = canFS && !ios;
  return { ios, android, standalone, chrome, firefox, canFS, trueFS,
           touch: navigator.maxTouchPoints > 0 };
})();
const IOS = PLAT.ios;
const CAN_FS = PLAT.canFS;
/* ¿Hay dedos de por medio? El emulador solo crea la opción "Virtual Gamepad" si detecta
   pantalla táctil, así que en un ordenador nunca llega a ocultarlo y el mando se queda
   ahí puesto. Lo tapamos nosotros. */
const TACTIL = PLAT.touch || matchMedia('(any-pointer: coarse)').matches;
if (!TACTIL) document.documentElement.classList.add('sin-tacto');

function realFS() { return document.fullscreenElement || document.webkitFullscreenElement; }
function isFS() { return realFS() || document.body.classList.contains('fs'); }

function toast(msg, ms) {
  let t = document.getElementById('fsToast');
  if (!t) { t = document.createElement('div'); t.id = 'fsToast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms || 5200);
}
async function tryNative(el) {
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (!req) return false;
  try { await req.call(el, { navigationUI: 'hide' }); } catch (e) {
    try { await req.call(el); } catch (e2) { return false; }
  }
  return !!realFS();
}
async function enterFS() {
  document.body.classList.add('fs');            // el juego ocupa todo ya mismo
  if (!IOS) {
    // 1º toda la página, 2º solo el juego (algunos navegadores lo prefieren)
    let ok = await tryNative(document.documentElement);
    if (!ok) ok = await tryNative(document.getElementById('game'));
    if (ok) {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
      return true;
    }
    toast(LANG === 'en' ? 'Your browser refused fullscreen. Install SALA 200 as an app for a clean screen.'
                        : 'El navegador no permite pantalla completa. Instala SALA 200 como app para verlo limpio.');
    return false;
  }
  // iOS: no existe pantalla completa para webs. Lo decimos claro y ofrecemos la app.
  scrollTo(0, 1);
  if (!navigator.standalone) {
    toast(LANG === 'en' ? 'iOS blocks true fullscreen in browsers · Share ▸ Add to Home Screen for the real thing'
                        : 'iOS no deja pantalla completa en el navegador · Compartir ▸ Añadir a inicio para tenerla de verdad');
  }
  return false;
}
function exitFS() {
  if (realFS()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
  if (screen.orientation && screen.orientation.unlock) { try { screen.orientation.unlock(); } catch (e) {} }
  document.body.classList.remove('fs');
}
function toggleFS() { isFS() ? exitFS() : enterFS(); }

document.getElementById('fsBtn').addEventListener('click', toggleFS);
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f' && !/input|textarea/i.test(document.activeElement.tagName)) toggleFS();
  if (k === 'escape') document.body.classList.remove('fs');
});
// si sales del modo nativo con el gesto del sistema, quitamos también el nuestro
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
  document.addEventListener(ev, () => { if (!realFS()) document.body.classList.remove('fs'); }));
// cuatro dedos = salir de pantalla completa (tres son para colocar los botones)
addEventListener('touchstart', e => { if (e.touches.length === 4 && isFS()) exitFS(); });

/* aviso solo donde de verdad no se puede: iOS */
if (IOS) {
  const b = document.getElementById('fsBtn');
  b.title = 'pantalla completa (en iOS, instala la web como app para que sea total)';
}

/* ---------- fuera el cartel de "pulsa para empezar" ----------
   EmulatorJS enseña un botón de inicio antes de arrancar el juego. Además de
   estorbar, dejaba al emulador parado y el detector de núcleos creía que el
   juego no tiraba. Lo pulsamos nosotros en cuanto aparece. */
(function sinCartelInicio() {
  const dale = () => {
    const b = document.querySelector('.ejs_start_button');
    if (b && b.offsetParent !== null) { try { b.click(); } catch (e) {} return true; }
    return false;
  };
  const t = setInterval(() => { if (dale()) clearInterval(t); }, 250);
  setTimeout(() => clearInterval(t), 30000);
})();

/* ---------- ¿este juego arranca con este núcleo? ----------
   El romset arcade es de una versión vieja de MAME, así que cada juego cuadra
   con un núcleo distinto. Probamos la cadena entera hasta dar con el bueno y lo
   apuntamos en el servidor: el siguiente que abra ese juego entra directo. */
if (sys === 'arcade' || sys === 'neogeo') (function vigilarArranque() {
  const CORES = (sys === 'arcade')
    ? ['mame2003_plus', 'mame2003', 'fbalpha2012_cps1', 'fbalpha2012_cps2', 'fbneo']
    : ['fbneo', 'mame2003_plus', 'mame2003', 'fbalpha2012_cps1', 'fbalpha2012_cps2'];
  const rom = p.get('rom') || '';
  const LLAVE = 'sala_probados2_' + rom;
  const leer = () => { try { return JSON.parse(sessionStorage.getItem(LLAVE) || '[]'); } catch (e) { return []; } };
  const anotar = (c) => {
    const l = leer();
    if (!l.includes(c)) l.push(c);
    try { sessionStorage.setItem(LLAVE, JSON.stringify(l)); } catch (e) {}
  };
  let cerrado = false, tocado = false;
  const actual = () => window.EJS_core;
  const frames = () => {
    const em = window.EJS_emulator;
    try { return em && em.gameManager ? (parseInt(em.gameManager.getFrameNum()) || 0) : 0; } catch (e) { return 0; }
  };
  /* si el jugador ya ha tocado algo (moneda, botón), el juego evidentemente va:
     a partir de ahí NADIE cambia de núcleo. Esto era lo que más rabia daba. */
  ['pointerdown', 'keydown'].forEach(ev =>
    addEventListener(ev, () => { tocado = true; }, { passive: true, capture: true }));

  const bueno = () => {
    if (cerrado) return;
    cerrado = true;
    clearInterval(tCorre); clearTimeout(tLimite);
    anotar(actual());
    fetch('/api/romstat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rom, core: actual(), ok: true }) }).catch(() => {});
    console.log('[sala200] núcleo bueno para', rom, '→', actual());
    saltarAvisos();
  };

  const saltarAvisos = () => setTimeout(() => {
    if (typeof saltarDisclaimer === 'function') saltarDisclaimer();
  }, 500);

  /* En cuanto el juego dibuja UN SOLO frame, el núcleo es válido: lo demás
     (disclaimer, pantalla de servicio, "insert coin") es cosa del propio juego. */
  const tCorre = setInterval(() => {
    if (cerrado) return;
    if (frames() > 0) bueno();
  }, 700);

  /* Solo se cambia de núcleo si a los 40 s no ha salido NI UN FRAME y el
     jugador no ha tocado nada: eso ya no es lentitud, es que no arranca. */
  const tLimite = setTimeout(() => {
    if (cerrado) return;
    if (frames() > 0 || tocado) { bueno(); return; }
    cerrado = true;
    clearInterval(tCorre);
    fetch('/api/romstat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rom, core: actual(), ok: false }) }).catch(() => {});
    anotar(actual());
    const probados = leer();
    const otro = CORES.find(c => !probados.includes(c));
    if (!otro) {
      try { sessionStorage.removeItem(LLAVE); } catch (e) {}
      toast(LANG === 'en' ? '❌ No core in the arcade can run this ROM'
                          : '❌ Ningún núcleo de la sala puede con esta ROM', 6000);
      return;
    }
    toast((LANG === 'en' ? '🔧 Trying core ' : '🔧 Probando con el núcleo ') + otro + '…', 2600);
    const u = new URL(location.href);
    u.searchParams.set('core', otro);
    setTimeout(() => location.replace(u.toString()), 1100);
  }, 40000);
})();

/* ---------- caja negra: si algo revienta, el motivo queda en el servidor ---------- */
function chivato(donde, msg) {
  try {
    const cuerpo = JSON.stringify({ tipo: 'crash', donde, msg: String(msg || '').slice(0, 500),
      juego: p.get('name') || '', sys, ua: navigator.userAgent.slice(0, 140) });
    if (navigator.sendBeacon) navigator.sendBeacon('/api/event', new Blob([cuerpo], { type: 'application/json' }));
    else fetch('/api/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: cuerpo, keepalive: true });
  } catch (e) {}
}
addEventListener('error', (e) => chivato('error',
  (e.message || '') + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0)));
addEventListener('unhandledrejection', (e) => chivato('promesa', e.reason && (e.reason.message || e.reason)));
/* contador de reencarnaciones: si Safari mata la pestaña y la resucita, la página
   entera recarga (aunque parezca que "solo se reinició el emulador" porque el HTML
   vuelve al instante de caché). Si este número sube, la página está muriendo. */
try {
  const n = (parseInt(sessionStorage.getItem('sala_bootn') || '0', 10) || 0) + 1;
  sessionStorage.setItem('sala_bootn', String(n));
  const nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
  if (n > 1) {
    const heap = sessionStorage.getItem('sala_heap') || '?';
    const vivo = sessionStorage.getItem('sala_vivo');
    const seg = vivo ? Math.round((Date.now() - (+vivo)) / 1000) : '?';
    chivato('reencarnacion', 'visita#' + n + ' tipo=' + (nav.type || '?') +
            ' · heap_antes=' + heap + 'MB · vivio=' + seg + 's');
  }
} catch (e) {}
/* vigía de memoria: apunta cada 5 s cuánto come el WASM; si la página muere,
   la reencarnación cuenta cuánto tenía justo antes (el arma del crimen) */
setInterval(() => {
  try {
    const em = window.EJS_emulator;
    const m = (em && em.gameManager && em.gameManager.Module) || window.Module;
    const bytes = m ? ((m.HEAPU8 && m.HEAPU8.length) || (m.HEAP8 && m.HEAP8.length) ||
                       (m.wasmMemory && m.wasmMemory.buffer && m.wasmMemory.buffer.byteLength) || 0) : 0;
    if (bytes) sessionStorage.setItem('sala_heap', String(Math.round(bytes / 1048576)));
    sessionStorage.setItem('sala_vivo', String(sessionStorage.getItem('sala_vivo') || Date.now()));
  } catch (e) {}
}, 5000);
try { sessionStorage.setItem('sala_vivo', String(Date.now())); } catch (e) {}

}

const LAND = innerWidth > innerHeight;
/* ---- tamaño del mando: se adapta a CUALQUIER pantalla ----
   Las posiciones viven en pad.css como múltiplos de --sala-btn, así que aquí
   solo hay que decidir cuánto miden botón y cruceta y todo se recoloca solo. */
const USER_SCALE = parseFloat(localStorage.getItem('sala_padscale') || '1');
function padBase() {
  const vv = window.visualViewport;                    // en Android la barra del navegador roba alto
  const W = Math.round(vv ? vv.width : innerWidth);
  const H = Math.round(vv ? vv.height : innerHeight);
  const land = W > H;
  const short = Math.min(W, H), long = Math.max(W, H);

  // punto de partida: proporción del lado corto, con topes por si es tablet o pantalla enorme
  let btn = short * (land ? .175 : .155);
  /* la cruceta iba muy grande en proporción a los botones; más contenida.
     Ojo: deslizar el dedo FUERA de ella sigue funcionando (el toque pertenece
     al elemento donde empezó), así que encogerla no te corta los movimientos. */
  let dpad = short * (land ? .41 : .355);
  // márgenes razonables en cualquier caso
  btn = Math.min(Math.max(btn, 42), 110);
  dpad = Math.min(Math.max(dpad, 96), 235);

  // ancho: cruceta + bloque de botones (3.15 botones) + separación mínima
  const fitsW = () => dpad + btn * 3.15 + Math.max(36, W * .06) <= W;
  // alto: la pila completa = pastillas + bloque + hueco + gatillos, con margen
  // en horizontal las pastillas van arriba y el mando sobresale por abajo: ocupa menos alto
  const stackH = () => land
    ? Math.max(dpad, btn * 3.15) * .8 + btn * .82 + 10
    : btn * .72 + 12 + Math.max(dpad, btn * 3.15) + btn * .28 + btn * .95 + btn * .82 + 14;
  const fitsH = () => stackH() <= H * (land ? .98 : .66);
  let guard = 0;
  while ((!fitsW() || !fitsH()) && guard++ < 60) { btn *= .97; dpad *= .97; }

  return { btn, dpad };
}
function applyPadSizeBase() { return padBase(); }
function applyPadSize() {
  const scale = parseFloat(localStorage.getItem('sala_padscale') || '1');
  const b = padBase();
  const btn = Math.round(b.btn * scale), dpad = Math.round(b.dpad * scale);
  document.documentElement.style.setProperty('--sala-btn', btn + 'px');
  document.documentElement.style.setProperty('--sala-dpad', dpad + 'px');
  return btn;
}
const BTN = applyPadSize();
// el tamaño de la letra sí lo fija EmulatorJS al crear los botones

const PILL = Math.max(9, Math.round(BTN * .16));

const TIGHT = LAND && innerHeight <= 400;

/* ---------- asignar el mando al jugador 1 ----------
   EmulatorJS solo lo hace si su menú de controles ya existe cuando conectas el mando,
   y además usa la ranura 0; si el sistema te da la 1 (pasa a menudo en macOS) no responde nada.
   Aquí lo asignamos a mano en cuanto haya emulador y mando. */
let padAsignado = false;
function asignarMando() {
  if (!conMando) return;                     // sin mando real no hay nada que asignar
  const em = window.EJS_emulator;
  if (!em || padAsignado) return;
  const p = padReal();                       // el de verdad, no un fantasma de Android
  if (!p) return;
  const pads = [...(navigator.getGamepads ? navigator.getGamepads() : [])].filter(Boolean)
               .filter(x => x !== p);        // los demás, por si hay un segundo mando real
  const etiqueta = p.id + '_' + p.index;
  try {
    if (!Array.isArray(em.gamepadSelection)) em.gamepadSelection = ['', '', '', ''];
    // el primer mando manda: jugador 1
    if (em.gamepadSelection[0] !== etiqueta) {
      em.gamepadSelection[0] = etiqueta;
      if (typeof em.updateGamepadLabels === 'function') em.updateGamepadLabels();
      if (typeof em.saveSettings === 'function') em.saveSettings();
    }
    // si hay un segundo mando real, al jugador 2
    const p2 = pads.find(x => x.buttons && x.buttons.length >= 4);
    if (p2) em.gamepadSelection[1] = p2.id + '_' + p2.index;
    padAsignado = true;
    const d = document.getElementById('padDiag');
    if (d) d.dataset.asignado = '1';
  } catch (e) {}
}
setInterval(asignarMando, 1000);
addEventListener('gamepadconnected', () => { padAsignado = false; setTimeout(asignarMando, 200); });

/* ---------- mando físico conectado: fuera los controles táctiles ----------
   Docenas de botones semitransparentes encima del canvas se componen en cada
   fotograma aunque nadie los toque. Con mando de verdad, no pintan nada. */
let conMando = false;
function vigilarMandoFisico() {
  /* solo cuenta un mando DE VERDAD (padReal filtra los dispositivos fantasma de
     Android): si no, escondíamos el táctil por un fantasma y te quedabas sin nada */
  const hay = !!padReal();
  if (hay === conMando) return;
  conMando = hay;
  document.body.classList.toggle('conmando', hay);
  if (hay) repararBindings();
  if (TACTIL) toast(hay
    ? (LANG === 'en' ? '🎮 Gamepad connected · touch controls hidden' : '🎮 Mando conectado · controles táctiles fuera')
    : (LANG === 'en' ? 'Gamepad gone · touch controls back' : 'Mando desconectado · vuelven los controles táctiles'), 2600);
}
/* Reparación del camino "oficial" de EmulatorJS, por si el nuestro no cubre un
   mando raro: (1) los ajustes guardados por juego pueden venir de una versión
   vieja SIN value2 (binding de mando) y machacan los buenos al cargar: se los
   reponemos; (2) su menú de ajustes nace con display "" y el emulador exige
   exactamente "none" para escuchar el mando: lo normalizamos. */
function repararBindings() {
  const em = window.EJS_emulator;
  if (!em || !em.controls) return;
  try {
    const def = (window.EJS_defaultControls || {})[0] || {};
    em.controls[0] = em.controls[0] || {};
    for (const k in def) {
      em.controls[0][k] = em.controls[0][k] || {};
      if (em.controls[0][k].value2 === undefined && def[k].value2 !== undefined)
        em.controls[0][k].value2 = def[k].value2;
    }
    if (typeof em.checkGamepadInputs === 'function') em.checkGamepadInputs();
    if (em.settingsMenu && !em.settingsMenuOpen && em.settingsMenu.style.display === '')
      em.settingsMenu.style.display = 'none';
  } catch (e) {}
}
vigilarMandoFisico();

/* y tras arrancar el juego, porque loadSettings restaura los controles guardados
   DESPUÉS y podría volver a pisar los bindings recién reparados */
[3000, 8000].forEach(t => setTimeout(repararBindings, t));

/* ================= VIBRACIÓN =================
   Android: API estándar. iPhone: Apple no la implementa, pero desde iOS 17.4 un
   interruptor nativo (<input type="checkbox" switch>) sí produce háptica al cambiar,
   así que lo usamos como sustituto. */
let hapSwitch = null, hapLabel = null;
function prepararHaptica() {
  if (hapSwitch) return;
  hapSwitch = document.createElement('input');
  hapSwitch.type = 'checkbox';
  hapSwitch.setAttribute('switch', '');
  hapSwitch.id = 'hapSw';
  hapSwitch.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;opacity:0';
  hapLabel = document.createElement('label');
  hapLabel.setAttribute('for', 'hapSw');
  hapLabel.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;opacity:0';
  document.body.appendChild(hapSwitch);
  document.body.appendChild(hapLabel);
}
function vibrar(ms) {
  try {
    if (navigator.vibrate && navigator.vibrate(ms || 15)) return true;   // Android
  } catch (e) {}
  try {                                                                   // iPhone
    prepararHaptica();
    hapLabel.click();
    return true;
  } catch (e) {}
  return false;
}

/* ================= EMOJIS =================
   Un cartel único y ligero (nada de lluvia de spans animados: comía fotogramas
   justo cuando el lockstep necesita todos). Viaja por el MISMO socket del
   netplay como mensaje s2:'emo', así que llega al instante y sin sondear la API. */
const EMOJIS = ['💀', '☠️', '🔥', '😈', '🖕', '🤡', '💣', '💥',
                '🔪', '⚔️', '🩸', '🥊', '👊', '😤', '🐍', '🦂',
                '🥶', '😏', '🏴‍☠️', '👑'];

function mostrarEmoji(emoji, quien) {
  const viejo = document.getElementById('emoBadge');
  if (viejo) viejo.remove();                       // uno como mucho en pantalla
  const b = document.createElement('div');
  b.id = 'emoBadge';
  b.innerHTML = `<span class="e"></span>${quien ? '<b></b>' : ''}`;
  b.querySelector('.e').textContent = emoji;
  if (quien) b.querySelector('b').textContent = quien.toUpperCase();
  document.body.appendChild(b);
  b.addEventListener('animationend', () => b.remove());
  setTimeout(() => { if (b.parentElement) b.remove(); }, 3200);   // red de seguridad
}
/* el pique de recreativa: frase lanzada, cartelón en la pantalla del rival
   y, si su navegador tiene voces, se la DICE en alto (síntesis del sistema,
   nada de micro ni sesiones de audio raras) */
const FRASES = [
  ['🔫', '¡UN TIRO TE PEGUEN!'],
  ['🔥', '¡TE FUNDO!'],
  ['🔪', '¡LAS TRIPAS TE SAQUEN!'],
  ['⛓️', '¡AMARRAO TE LLEVEN!'],
  ['🙏', '¡REZA LO QUE SEPAS!'],
  ['⚰️', '¡ESTÁS MUERTO!'],
  ['📦', '¡ERES UN PAQUETE!'],
  ['😴', '¡A DORMIR!'],
  ['🐟', '¡SOY EL CARPA DE CAÑORROTO, MIERDAS!'],
];
function decir(texto) {
  try {
    if (!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(texto.toLowerCase());
    u.lang = 'es-ES'; u.rate = 1.05; u.pitch = .9; u.volume = 1;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {}
}
function mostrarFrase(texto, icono, quien) {
  const viejo = document.getElementById('emoBadge');
  if (viejo) viejo.remove();
  const b = document.createElement('div');
  b.id = 'emoBadge'; b.className = 'frase';
  b.innerHTML = '<span class="e"></span><b></b>' + (quien ? '<i></i>' : '');
  b.querySelector('.e').textContent = icono || '💀';
  b.querySelector('b').textContent = texto;
  if (quien) b.querySelector('i').textContent = '— ' + quien.toUpperCase();
  document.body.appendChild(b);
  b.addEventListener('animationend', () => b.remove());
  setTimeout(() => { if (b.parentElement) b.remove(); }, 3600);
}
function lanzarFrase(icono, texto) {
  const em = window.EJS_emulator;
  if (!em || !em.isNetplay || !em.netplay || !em.netplay.socket) { sinRival(); return; }
  mostrarFrase(texto, icono, null);
  vibrar([20, 30, 40]);
  lkEnviar(em, { s2: 'emo', e: icono, f: texto, de: quienSoy() });
}
function sinRival() {
  toast(LANG === 'en' ? 'Only works in a 2-player room' : 'Solo funciona en sala de 2 jugadores', 2600);
}
function lanzarEmoji(emoji) {
  const em = window.EJS_emulator;
  if (!em || !em.isNetplay || !em.netplay || !em.netplay.socket) { sinRival(); return; }
  mostrarEmoji(emoji, null);                      // lo ves al instante
  vibrar(18);
  lkEnviar(em, { s2: 'emo', e: emoji, de: quienSoy() });
}

function montarEmojis() {
  if (document.getElementById('emojiBtn')) return;
  const b = document.createElement('button');
  b.id = 'emojiBtn'; b.textContent = '😀';
  b.title = TP.tEmoji;
  document.body.appendChild(b);
  const fila = document.createElement('div');
  fila.id = 'emojiFila';
  fila.innerHTML = EMOJIS.map(e => `<button data-e="${e}">${e}</button>`).join('') +
    '<div class="sep"></div>' +
    FRASES.map((f, i) => `<button class="frase" data-i="${i}">${f[0]} ${f[1]}</button>`).join('');
  document.body.appendChild(fila);
  b.onclick = () => fila.classList.toggle('on');
  fila.addEventListener('click', ev => {
    const btn = ev.target.closest('button');
    if (!btn) return;

      if (f) lanzarFrase(f[0], f[1]);
    } else if (btn.dataset.e) {
      lanzarEmoji(btn.dataset.e);
    }
    fila.classList.remove('on');
  });
}

/* ================= LA MONEDA DE 25 PESETAS =================
   INSERT COIN de recreativa: en FBNeo la moneda es el input SELECT (2).
   Pasa por gameManager.simulateInput, así que en red viaja por el lockstep
   como cualquier botón: cada jugador echa SU moneda (la del invitado entra
   como moneda del jugador 2, igual que en el mueble de verdad). */
let monedaEchada = false;      // la primera de la sesión entra sola al pulsar cualquier botón
function monedaSiPrimera() {
  if (monedaEchada || (sys !== 'arcade' && sys !== 'neogeo')) return;

}
function echarMoneda() {

    return;
  }
  try {
    em.gameManager.simulateInput(0, 2, 1);
    setTimeout(() => { try { em.gameManager.simulateInput(0, 2, 0); } catch (e) {} }, 120);
  } catch (e) { return; }
  vibrar([15, 40, 25]);
  npPito([2093, 1568, 2637], .22, .09);                  // clink de la moneda al caer
  const b = document.getElementById('pesetaBtn');
  if (b) { b.classList.remove('echada'); void b.offsetWidth; b.classList.add('echada'); }
  toast(LANG === 'en' ? '🪙 Coin in · 25 ptas' : '🪙 Moneda dentro · 25 ptas', 1400);
}
function montarPeseta() {

/* ---------- el botón de 2 JUGADORES, bien cableado ----------
   En un mueble, START2 es del SEGUNDO puerto, no un botón más del primero.
   Jugando solo en la máquina: mete moneda del jugador 2 y pulsa su START.
   En partida por red cada uno es un puerto, así que allí vale como tu START. */
function montarDosJugadores() {
  if (sys !== 'arcade' && sys !== 'neogeo') return;
  const b = document.querySelector('.ejs_virtualGamepad_button.b_start');
  if (!b || b._2p) return;
  b._2p = true;
  const pulsa = (puerto, idx, v) => {
    try { window.EJS_emulator.gameManager.simulateInput(puerto, idx, v); } catch (e) {}
  };
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    const em = window.EJS_emulator;
    if (!em || !em.started) return;
    if (em.isNetplay) {                 // en red, tu puerto ya es el tuyo
      pulsa(0, 3, 1);
      setTimeout(() => pulsa(0, 3, 0), 110);
      return;
    }
    pulsa(1, 2, 1);                     // moneda del jugador 2
    setTimeout(() => pulsa(1, 2, 0), 90);
    setTimeout(() => { pulsa(1, 3, 1); setTimeout(() => pulsa(1, 3, 0), 110); }, 260);
    vibrar(18);
    toast(LANG === 'en' ? '👥 Player 2 in!' : '👥 ¡Jugador 2 dentro!', 1600);
  }, true);
}

/* ================= MARCO DE PANTALLA AJUSTABLE =================
   Un rectángulo que colocas y estiras a tu gusto: el juego se dibuja justo ahí.
   Se guarda por consola y orientación, y viaja con tu perfil. */
const MARCOKEY = () => `sala_marco_${sys}_${innerWidth > innerHeight ? 'h' : 'v'}`;
let marco = null, marcoEdit = false, marcoDrag = null;
try { marco = JSON.parse(localStorage.getItem(MARCOKEY()) || 'null'); } catch (e) { marco = null; }
fetch('/api/padlayout').then(r => r.json()).then(d => {
  const m = (d.layout || {})[MARCOKEY()];
  if (m && m.w) { marco = m; localStorage.setItem(MARCOKEY(), JSON.stringify(m)); aplicarMarco(); }
}).catch(() => {});

function lienzo() { return document.querySelector('canvas.ejs_canvas'); }
function guardarMarco() {
  if (!marco) return;
  localStorage.setItem(MARCOKEY(), JSON.stringify(marco));
  clearTimeout(window._gm);
  window._gm = setTimeout(() => {
    fetch('/api/padlayout', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clave: MARCOKEY(), pos: marco }) }).catch(() => {});
  }, 900);
}
function aplicarMarco() {
  const c = lienzo();
  if (!c) return;
  if (!marco) {
    ['position', 'left', 'top', 'width', 'height', 'max-width', 'max-height', 'z-index'].forEach(p => c.style.removeProperty(p));
    return;
  }
  const S = c.style;
  S.setProperty('position', 'fixed', 'important');
  S.setProperty('left', Math.round(marco.x * innerWidth) + 'px', 'important');
  S.setProperty('top', Math.round(marco.y * innerHeight) + 'px', 'important');
  S.setProperty('width', Math.round(marco.w * innerWidth) + 'px', 'important');
  S.setProperty('height', Math.round(marco.h * innerHeight) + 'px', 'important');
  S.setProperty('max-width', 'none', 'important');
  S.setProperty('max-height', 'none', 'important');
  S.setProperty('z-index', '1', 'important');   // por debajo del mando, o tapaba L y R
  const caja = document.getElementById('marcoCaja');
  if (caja && marcoEdit) {
    caja.style.left = (marco.x * innerWidth) + 'px';
    caja.style.top = (marco.y * innerHeight) + 'px';
    caja.style.width = (marco.w * innerWidth) + 'px';
    caja.style.height = (marco.h * innerHeight) + 'px';
  }
}
function marcoPorDefecto() {
  const c = lienzo();
  const r = c ? c.getBoundingClientRect() : null;
  return (r && r.width > 20)
    ? { x: r.left / innerWidth, y: r.top / innerHeight, w: r.width / innerWidth, h: r.height / innerHeight }
    : { x: .06, y: .08, w: .88, h: .74 };
}
function editarMarco(v) {
  marcoEdit = v;
  let caja = document.getElementById('marcoCaja');
  if (v) {
    if (!marco || !marco.w) marco = marcoPorDefecto();
    if (!caja) { caja = crearCaja(); }
    caja.style.display = 'block';
    aplicarMarco();
    barraMarco(true);
  } else {
    if (caja) { caja.style.display = 'none'; caja.remove(); }     // fuera del todo
    marcoDrag = null;
    barraMarco(false);
    const b = document.getElementById('marcoBar');
    if (b) b.remove();
    guardarMarco();
    aplicarMarco();
    toast(LANG === 'en' ? 'Screen saved' : 'Pantalla guardada', 1800);
  }
}

function crearCaja() {
  const caja = document.createElement('div');
  caja.id = 'marcoCaja';
  caja.innerHTML = '<span class="mh nw"></span><span class="mh ne"></span>' +
                   '<span class="mh sw"></span><span class="mh se"></span>' +
                   `<span class="mtxt">${TP.marcoDrag}</span>`;
  document.body.appendChild(caja);

  // un solo gestor con eventos de puntero: vale para dedo, ratón y lápiz
  const alBajar = (e) => {
    const esq = e.target.classList && e.target.classList.contains('mh')
      ? ['nw', 'ne', 'sw', 'se'].find(x => e.target.classList.contains(x)) : null;
    marcoDrag = { esq, x0: e.clientX, y0: e.clientY, base: { ...marco } };
    try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault(); e.stopPropagation();
  };
  const alMoverP = (e) => {
    if (!marcoDrag) return;
    e.preventDefault(); e.stopPropagation();
    const dx = (e.clientX - marcoDrag.x0) / innerWidth;
    const dy = (e.clientY - marcoDrag.y0) / innerHeight;
    const b = marcoDrag.base, min = .12;
    if (!marcoDrag.esq) {
      marco.x = Math.max(0, Math.min(1 - b.w, b.x + dx));
      marco.y = Math.max(0, Math.min(1 - b.h, b.y + dy));
    } else {
      const oeste = marcoDrag.esq.includes('w'), norte = marcoDrag.esq.includes('n');
      if (oeste) { const nx = Math.max(0, Math.min(b.x + dx, b.x + b.w - min)); marco.w = b.w + (b.x - nx); marco.x = nx; }
      else       { marco.w = Math.max(min, Math.min(1 - b.x, b.w + dx)); }
      if (norte) { const ny = Math.max(0, Math.min(b.y + dy, b.y + b.h - min)); marco.h = b.h + (b.y - ny); marco.y = ny; }
      else       { marco.h = Math.max(min, Math.min(1 - b.y, b.h + dy)); }
    }
    aplicarMarco();
  };
  const alSubir = (e) => {
    if (!marcoDrag) return;
    marcoDrag = null;
    guardarMarco();
    try { e.target.releasePointerCapture(e.pointerId); } catch (err) {}
  };
  [caja, ...caja.querySelectorAll('.mh')].forEach(el => {
    el.addEventListener('pointerdown', alBajar);
    el.addEventListener('pointermove', alMoverP);
    el.addEventListener('pointerup', alSubir);
    el.addEventListener('pointercancel', alSubir);
  });
  return caja;
}

/* --- pantalla partida: cada uno ve SU mitad ampliada ---
   El juego renderiza el frame entero (los dos visores) en los dos lados; aquí
   solo ampliamos el lienzo y centramos la banda de tu visor. J1 (anfitrión)
   arriba, J2 (invitado) abajo, como reparte Mario Kart. Reversible al toque. */
let quieroMitad = false, mitadAplicada = false, marcoAntes = null;
function aplicarMitad() {
  const em = window.EJS_emulator;
  const soyP1 = !!(em && em.netplay && em.netplay.owner);   // J1 arriba, J2 abajo
  const W = innerWidth, H = innerHeight;
  const ch = W * .75;                       // lienzo 4:3 a todo lo ancho
  const banda = ch / 2;                     // tu visor: media pantalla del juego
  const y = (H - banda) / 2 - (soyP1 ? 0 : banda);
  const nuevo = { x: 0, w: 1, y: y / H, h: ch / H };
  if (!mitadAplicada) marcoAntes = marco;   // guardamos tu ajuste para devolverlo
  // se reaplica también si giraste el móvil (cambian las proporciones)
  if (!mitadAplicada || !marco || Math.abs(marco.y - nuevo.y) > .001 ||
      Math.abs(marco.h - nuevo.h) > .001) {
    marco = nuevo;
    aplicarMarco();
  }
  mitadAplicada = true;
}
function quitarMitad() {
  if (!mitadAplicada) return;
  mitadAplicada = false;
  marco = marcoAntes; marcoAntes = null;
  aplicarMarco();
}
/* la mitad solo se ve con la partida a dobles SINCRONIZADA; antes y después,
   pantalla normal. Lo mantiene vigilarNetplay. */
function mantenerMitad() {
  const em = window.EJS_emulator;
  if (quieroMitad && em && em.isNetplay && L.on) aplicarMitad();
  else quitarMitad();
}
function soloMiMitad() {
  quieroMitad = !quieroMitad;
  const em = window.EJS_emulator;
  if (!quieroMitad) toast(TP.mitadOff, 1800);
  else toast((em && em.isNetplay && L.on) ? TP.mitadOn : TP.mitadArmada, 2600);
  mantenerMitad();
}

/* ================= PARTIDA GUARDADA SOLA =================
   Cada poco guardamos una foto completa del juego en tu perfil (no en este móvil),
   así puedes seguir donde lo dejaste aunque cambies de aparato. Como es una foto
   del sistema entero, se lleva también los ajustes de dentro del juego: los mandos
   redefinidos del Street Fighter, opciones, dificultad... todo. */
/* ojo: EJS_gameID se calcula más abajo en el fichero, así que la clave se pide
   cuando hace falta, no al cargar (si no, todos los juegos compartirían partida) */
const CLAVE_PARTIDA = () => `${sys}_${window.EJS_gameID || 0}`;
let autoguardado = true;
try { autoguardado = localStorage.getItem('sala_autosave') !== '0'; } catch (e) {}
let ultimoGuardado = 0, guardando = false, reanudada = false;

function puedeGuardar() {
  if (ESPIAR) return false;                    // el palco ni guarda ni reanuda
  const em = window.EJS_emulator;
  if (!em || !em.started || !em.gameManager) return false;
  if (em.isNetplay && !(em.netplay && em.netplay.owner)) return false;   // el invitado no manda
  return true;
}

async function guardarPartida(motivo) {
  if (!autoguardado || guardando || !puedeGuardar()) return false;
  /* En partida en red NO se autoguarda: getState() son varios MB síncronos y el
     tirón pausaba el lockstep del rival (y a veces forzaba un resync con savestate).
     Guardar a mano o al salir sí se puede. */
  if ((motivo === 'auto' || motivo === 'fondo') &&
      window.EJS_emulator.isNetplay) return false;
  guardando = true;
  try {
    const em = window.EJS_emulator;
    /* serializar EN CALIENTE mata FBNeo en el Safari del iPhone (mismo mal que
       tuvo el checkpoint): pausa breve, dejar asentar el frame, foto, y seguir */
    const estaba = em.paused;
    if (!estaba) em.pause(true);
    await new Promise(r => setTimeout(r, 80));
    let bytes = null;
    try { bytes = em.gameManager.getState(); }
    finally { if (!estaba) { try { em.play(true); } catch (e2) {} } }
    if (!bytes || !bytes.length) { guardando = false; return false; }
    const r = await fetch('/api/estado?j=' + encodeURIComponent(CLAVE_PARTIDA()), {
      method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: bytes });
    ultimoGuardado = Date.now();
    guardando = false;
    if (motivo === 'mano') toast(LANG === 'en' ? 'Game saved' : 'Partida guardada', 1600);
    return r.ok;
  } catch (e) { guardando = false; return false; }
}

async function reanudarPartida() {
  if (ESPIAR) return;
  if (!autoguardado || reanudada || !puedeGuardar()) return;
  if (window.EJS_emulator.isNetplay) return;          // en red manda el anfitrión
  reanudada = true;
  try {
    const info = await (await fetch('/api/estado?j=' + encodeURIComponent(CLAVE_PARTIDA()) + '&info=1')).json();
    if (!info.hay) return;
    const buf = await (await fetch('/api/estado?j=' + encodeURIComponent(CLAVE_PARTIDA()))).arrayBuffer();
    if (!buf || !buf.byteLength) return;
    window.EJS_emulator.gameManager.loadState(new Uint8Array(buf));
    const hace = Math.round((Date.now() - info.cuando) / 60000);
    toast((LANG === 'en' ? '▶ Resumed where you left it' : '▶ Sigues donde lo dejaste') +
          (hace > 0 && hace < 100000 ? ` · hace ${hace < 60 ? hace + ' min' : Math.round(hace / 60) + ' h'}` : ''), 3200);
  } catch (e) {}
}

function empezarDeCero() {
  fetch('/api/estado?j=' + encodeURIComponent(CLAVE_PARTIDA()) + '&borrar=1', { method: 'POST' })
    .then(() => { toast(LANG === 'en' ? 'Progress cleared, restarting' : 'Partida borrada, empezamos de cero', 2200);
                  setTimeout(() => location.reload(), 900); })
    .catch(() => {});
}

/* al arrancar: reanudar. Luego, guardar cada 45 s y al salir o irte a otra app. */
setTimeout(reanudarPartida, 2500);
setInterval(() => { if (Date.now() - ultimoGuardado > 44000) guardarPartida('auto'); }, 15000);
addEventListener('visibilitychange', () => { if (document.hidden) guardarPartida('fondo'); });
addEventListener('pagehide', () => { guardarPartida('salida'); });

/* y los guardados propios del juego (la pila del cartucho) cada poco, no cada 5 minutos */
setTimeout(() => {
  try {
    const em = window.EJS_emulator;
    if (!em || typeof em.changeSettingOption !== 'function') return;
    /* En iOS la escritura periódica de la pila/memory card dispara un
       "Permission was denied" y ~30 s después WebKit mata la pestaña (los Neo
       Geo escriben memory card SIEMPRE; los SNES sin pila ni se inmutan: por
       eso solo moría Neo Geo). En iOS ni una escritura automática: el progreso
       ya lo cubre nuestro autoguardado por servidor. */
    em.changeSettingOption('save-save-interval', ES_IOS ? '0' : '30');
  } catch (e) {}
}, 6000);

/* pedimos almacenamiento permanente: si no, el navegador puede tirar el juego
   guardado en cuanto le apriete el espacio, y volverías a descargarlo entero */
try {
  if (navigator.storage && navigator.storage.persist)
    navigator.storage.persist().catch(() => {});   // iOS lo deniega y rechaza la promesa
} catch (e) {}

/* ================= QUE NO SE APAGUE LA PANTALLA =================
   Mientras juegas no se toca la pantalla durante minutos, así que el móvil se
   bloquea solo en mitad de una partida. Con el bloqueo de pantalla del navegador
   lo evitamos. Ojo: se suelta al irte a otra app, hay que volver a pedirlo. */
let despierto = null, quiereDespierto = true;
try { quiereDespierto = localStorage.getItem('sala_despierto') !== '0'; } catch (e) {}

async function pedirDespierto() {
  if (!quiereDespierto || despierto) return;
  if (!('wakeLock' in navigator)) {
    if (!window.__avisoDespierto) {
      window.__avisoDespierto = true;
      console.warn('[sala200] este navegador no sabe mantener la pantalla encendida');
    }
    return;
  }
  try {
    despierto = await navigator.wakeLock.request('screen');
    despierto.addEventListener('release', () => { despierto = null; });
  } catch (e) {
    console.warn('[sala200] no me dejan mantener la pantalla encendida:', e && e.name);
  }
}
async function soltarDespierto() {
  try { if (despierto) await despierto.release(); } catch (e) {}
  despierto = null;
}
function estadoDespierto() {
  if (!('wakeLock' in navigator)) return TP.despNo;
  return despierto ? TP.despEnc : (quiereDespierto ? TP.despPid : TP.despOff);
}
/* Lo pedimos cuanto antes (las esperas largas de PS1 son justo cuando molesta),
   y lo reintentamos cada 15 s: el navegador lo suelta solo en cuanto llega una
   notificación o cambias de app, y si no insistes te quedas sin él. */
pedirDespierto();
setTimeout(pedirDespierto, 800);
setInterval(() => { if (quiereDespierto && !despierto && !document.hidden) pedirDespierto(); }, 15000);
addEventListener('visibilitychange', () => { if (!document.hidden) pedirDespierto(); else soltarDespierto(); });
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { if (!despierto) pedirDespierto(); }, { passive: true }));
addEventListener('pagehide', soltarDespierto);

/* ================= MEDIDOR DE RENDIMIENTO =================
   Para poder diagnosticar tirones sin adivinar: fotogramas por segundo,
   el mínimo de los últimos segundos y la memoria que gasta la página. */
let fpsRAF = null;
function medidor(encender) {
  const b = document.getElementById('pmFps');
  const viejo = document.getElementById('fpsBox');
  if (viejo) { viejo.remove(); cancelAnimationFrame(fpsRAF); fpsRAF = null; }
  if (b) b.textContent = encender ? TP.si : TP.no;
  try { localStorage.setItem('sala_fps', encender ? '1' : '0'); } catch (e) {}
  if (!encender) return;

  const caja = document.createElement('div');
  caja.id = 'fpsBox';
  caja.style.cssText = 'position:fixed;z-index:10007;right:max(8px,env(safe-area-inset-right));' +
    'top:max(52px,env(safe-area-inset-top));background:rgba(3,10,6,.72);color:#39ff88;' +
    'font:600 11px ui-monospace,Menlo,monospace;padding:6px 9px;border:1px solid #1a3324;' +
    'pointer-events:none;line-height:1.5;text-align:right;white-space:pre';
  document.body.appendChild(caja);

  let cuenta = 0, t0 = performance.now(), minimo = 999, seg = 0;
  const paso = (t) => {
    cuenta++;
    if (t - t0 >= 1000) {
      const fps = cuenta * 1000 / (t - t0);
      seg++;
      if (seg > 2) minimo = Math.min(minimo, fps);         // los 2 primeros no cuentan (arranque)
      const mem = performance.memory
        ? Math.round(performance.memory.usedJSHeapSize / 1048576) + ' MB' : '';
      let red = '';
      try { if (L && L.on) red = '\nred ' + L.d + 'f (' + Math.round(L.d * 16.7) + 'ms)' +
        (L.rtt ? ' · rtt ' + L.rtt + 'ms' : '') + (L.p2p ? ' · P2P' : ' · túnel'); } catch (e) {}
      caja.textContent = fps.toFixed(0) + ' fps\nmin ' + (minimo < 999 ? minimo.toFixed(0) : '-') +
                         (mem ? '\n' + mem : '') + red + '\n' + seg + ' s';
      cuenta = 0; t0 = t;
    }
    fpsRAF = requestAnimationFrame(paso);
  };
  fpsRAF = requestAnimationFrame(paso);
}
try { if (localStorage.getItem('sala_fps') === '1') setTimeout(() => medidor(true), 1500); } catch (e) {}

/* ================= VOLVER AL MENÚ =================
