/* ================= JOYSTICK EN LUGAR DE CRUCETA =================
   La cruceta de plástico está bien para saltar, pero para moverse en diagonal
   un stick va mucho mejor. Se guarda por sistema y por perfil. */
const STICKKEY = () => `sala_stick_${sys}`;
/* En N64, Neo Geo y arcade se juega con palanca, así que la bola viene de fábrica.
   En consolas de cruceta (SNES, Mega Drive) manda la cruz salvo que digas otra cosa. */
/* tres modos: 'bola' (la roja de recreativa), 'ligero' (aro plano, rinde más
   en móviles justitos) y 'cruz'. Guardado por sistema: 1=bola 2=ligero 0=cruz. */
let stickModo = (sys === 'n64' || sys === 'neogeo' || sys === 'arcade' || sys === 'psx') ? 'bola' : 'cruz';
try {
  const g = localStorage.getItem(STICKKEY());
  if (g === '1') stickModo = 'bola';
  else if (g === '2') stickModo = 'ligero';
  else if (g === '0') stickModo = 'cruz';
} catch (e) {}
let joystick = stickModo !== 'cruz';
const ES_ANALOGICO = (sys === 'n64' || sys === 'psx');   // stick de verdad, no cruceta
const ES_PSX = (sys === 'psx');
const ES_N64 = ES_ANALOGICO;
const DIRS = { arriba: 4, abajo: 5, izq: 6, der: 7 };      // cruceta digital (SNES, Mega Drive...)
const EJES = { arriba: 19, abajo: 18, izq: 17, der: 16 };  // stick analógico del N64
let dirPulsadas = { arriba: 0, abajo: 0, izq: 0, der: 0 };
let ejeValor = { 16: 0, 17: 0, 18: 0, 19: 0 };

/* En N64 no vale con "pulsado o no": hay que mandar cuánto inclinas el stick,
   que es lo que diferencia andar de puntillas de salir corriendo. */
function mandarEje(idx, valor) {
  valor = Math.max(0, Math.min(32767, Math.round(valor)));
  if (ejeValor[idx] === valor) return;
  ejeValor[idx] = valor;
  try {
    const em = window.EJS_emulator;
    if (em && em.gameManager) em.gameManager.simulateInput(0, idx, valor);
  } catch (e) {}
}
function mandarAnalogico(ux, uy, fuerza) {
  const f = Math.max(0, Math.min(1, fuerza)) * 32767;
  mandarEje(EJES.der,    ux > 0 ? f * Math.abs(ux) : 0);
  mandarEje(EJES.izq,    ux < 0 ? f * Math.abs(ux) : 0);
  mandarEje(EJES.abajo,  uy > 0 ? f * Math.abs(uy) : 0);
  mandarEje(EJES.arriba, uy < 0 ? f * Math.abs(uy) : 0);
}

function mandarDir(dir, valor) {
  if (dirPulsadas[dir] === valor) return;
  dirPulsadas[dir] = valor;
  try {
    const em = window.EJS_emulator;
    if (em && em.gameManager) em.gameManager.simulateInput(0, DIRS[dir], valor);
  } catch (e) {}
}
function soltarTodo() {
  Object.keys(DIRS).forEach(d => mandarDir(d, 0));
  if (ES_N64) Object.values(EJES).forEach(i => mandarEje(i, 0));
}

/* Bola roja de salón recreativo, con sus años encima: brillo especular arriba,
   arañazos de mil partidas, desconchones donde se ha ido la pintura y roña en el ecuador. */
function texturaBola() {
  const T = 256, c = document.createElement('canvas');
  c.width = c.height = T;
  const g = c.getContext('2d');
  const R = T / 2;
  const az = (a, b) => a + Math.random() * (b - a);

  g.save();
  g.beginPath(); g.arc(R, R, R - 2, 0, 7); g.clip();      // todo dentro de la esfera

  // cuerpo: rojo de bola clásica, con el volumen hecho con el degradado
  const base = g.createRadialGradient(R * .68, R * .58, R * .06, R, R, R);
  base.addColorStop(0,   '#ff8b7a');
  base.addColorStop(.18, '#e63b2e');
  base.addColorStop(.55, '#b4231b');
  base.addColorStop(.82, '#6d120f');
  base.addColorStop(1,   '#2b0705');
  g.fillStyle = base; g.fillRect(0, 0, T, T);

  // roña acumulada en la parte baja
  const roña = g.createRadialGradient(R, R * 1.45, R * .1, R, R * 1.2, R);
  roña.addColorStop(0, 'rgba(40,26,20,.5)');
  roña.addColorStop(1, 'rgba(40,26,20,0)');
  g.fillStyle = roña; g.fillRect(0, 0, T, T);

  // grano del plástico
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},${az(.02, .07)})`;
    g.fillRect(az(0, T), az(0, T), 1, 1);
  }

  // arañazos: finos, curvos y sobre todo por donde roza la mano
  for (let i = 0; i < 34; i++) {
    const a = az(0, 6.28), d = az(R * .25, R * .95);
    const x = R + Math.cos(a) * d, y = R + Math.sin(a) * d;
    const largo = az(6, 34), ang = az(0, 6.28);
    g.strokeStyle = `rgba(255,235,225,${az(.05, .22)})`;
    g.lineWidth = az(.5, 1.4);
    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(ang) * largo * .5 + az(-4, 4),
                       y + Math.sin(ang) * largo * .5 + az(-4, 4),
                       x + Math.cos(ang) * largo, y + Math.sin(ang) * largo);
    g.stroke();
  }

  // desconchones: se ve el plástico gris de debajo
  for (let i = 0; i < 9; i++) {
    const a = az(0, 6.28), d = az(R * .3, R * .88);
    const x = R + Math.cos(a) * d, y = R + Math.sin(a) * d, r = az(2.5, 7);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(214,206,198,${az(.5, .8)})`);
    gr.addColorStop(.6, `rgba(150,140,134,${az(.2, .4)})`);
    gr.addColorStop(1, 'rgba(120,110,104,0)');
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(x, y, r, r * az(.5, .9), az(0, 3), 0, 7); g.fill();
  }

  // marcas de golpes más oscuras
  for (let i = 0; i < 6; i++) {
    const a = az(0, 6.28), d = az(R * .4, R * .9);
    const x = R + Math.cos(a) * d, y = R + Math.sin(a) * d, r = az(3, 9);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(30,10,8,${az(.25, .5)})`);
    gr.addColorStop(1, 'rgba(30,10,8,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }

  // brillo especular principal, ya apagado por el uso
  const esp = g.createRadialGradient(R * .62, R * .5, 0, R * .62, R * .5, R * .42);
  esp.addColorStop(0, 'rgba(255,255,255,.78)');
  esp.addColorStop(.35, 'rgba(255,225,215,.24)');
  esp.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = esp;
  g.beginPath(); g.ellipse(R * .68, R * .55, R * .38, R * .3, -.5, 0, 7); g.fill();

  // luz de rebote por abajo, que redondea la esfera
  const reb = g.createRadialGradient(R * 1.2, R * 1.5, 0, R * 1.2, R * 1.5, R * .8);
  reb.addColorStop(0, 'rgba(255,150,120,.22)');
  reb.addColorStop(1, 'rgba(255,150,120,0)');
  g.fillStyle = reb; g.fillRect(0, 0, T, T);

  // borde oscuro para que no parezca un círculo plano
  const borde = g.createRadialGradient(R, R, R * .72, R, R, R);
  borde.addColorStop(0, 'rgba(0,0,0,0)');
  borde.addColorStop(1, 'rgba(0,0,0,.65)');
  g.fillStyle = borde; g.fillRect(0, 0, T, T);
  g.restore();

  return c.toDataURL('image/png');
}

let _bolaURL = null;
function bolaURL() {   // la textura se dibuja UNA vez por sesión, no en cada cambio
  if (_bolaURL === null) { try { _bolaURL = texturaBola(); } catch (e) { _bolaURL = ''; } }
  return _bolaURL;
}
function montarStick() {
  if (document.getElementById('stick')) return;
  const st = document.createElement('div');
  st.id = 'stick';
  st.innerHTML = '<div id="stickBase"></div><div id="stickKnob"></div>';
  document.body.appendChild(st);
  const knob = st.querySelector('#stickKnob');
  let centro = null, radio = 60;

  st.addEventListener('pointerdown', e => {
    if (modoColocar) return;                       // en modo colocar se arrastra, no se juega
    const r = st.getBoundingClientRect();
    centro = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    radio = r.width * .42;
    st.classList.add('agarrado');
    st.setPointerCapture(e.pointerId);
    mover(e);
    e.preventDefault();
  });
  let tMov = 0;
  st.addEventListener('pointermove', e => {
    if (!centro) return;
    e.preventDefault();
    const t = performance.now();     // Android dispara 120-240 eventos/s; el juego pinta 60
    if (t - tMov < 12) return;
    tMov = t;
    mover(e);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev =>
    st.addEventListener(ev, () => {
      centro = null;
      st.classList.remove('agarrado');
      knob.style.transform = '';
      soltarTodo();
    }));

  function mover(e) {
    let dx = e.clientX - centro.x, dy = e.clientY - centro.y;
    const d = Math.hypot(dx, dy) || 1;
    const lim = Math.min(d, radio);
    const ux = dx / d, uy = dy / d;
    knob.style.transform = `translate(${ux * lim}px, ${uy * lim}px)`;
    // zona muerta para no disparar direcciones sin querer
    const fuerza = d / radio;
    if (fuerza < .18) { soltarTodo(); return; }
    if (ES_ANALOGICO) {                 // analógico: cuanto más lejos del centro, más rápido
      mandarAnalogico(ux, uy, (fuerza - .12) / .88);
      /* En PS1 muchísimos juegos son SOLO digitales (el Resident Evil 1, por ejemplo,
         ni conoce el stick). Así que la bola manda además la cruceta: funciona en todos. */
      if (ES_PSX) {
        const U = .34;
        mandarDir('izq',    ux < -U ? 1 : 0);
        mandarDir('der',    ux >  U ? 1 : 0);
        mandarDir('arriba', uy < -U ? 1 : 0);
        mandarDir('abajo',  uy >  U ? 1 : 0);
      }
      return;
    }
    const UMBRAL = .38;
    if (fuerza < .3) { soltarTodo(); return; }
    mandarDir('izq',    ux < -UMBRAL ? 1 : 0);
    mandarDir('der',    ux >  UMBRAL ? 1 : 0);
    mandarDir('arriba', uy < -UMBRAL ? 1 : 0);
    mandarDir('abajo',  uy >  UMBRAL ? 1 : 0);
  }
}

function colocarStick() {
  const st = document.getElementById('stick');
  if (!st) return;
  let pos = null;
  try {
    if (posiciones['f_stick']) return;             // ya lo has colocado tú: no lo toques
    pos = posiciones['dpad'] || null;              // si moviste la cruceta, hereda su sitio
  } catch (e) { pos = null; }
  if (!pos) return;                                // sin datos, manda el sitio por defecto del CSS
  const lado = st.offsetWidth || 170;
  const x = Math.max(4, Math.min(innerWidth - lado - 4, pos.x * innerWidth));
  const y = Math.max(4, Math.min(innerHeight - lado - 4, pos.y * innerHeight));
  st.style.left = Math.round(x) + 'px';
  st.style.top = Math.round(y) + 'px';
  st.style.bottom = 'auto';
}

function aplicarStick() {
  montarStick();
  joystick = stickModo !== 'cruz';
  document.documentElement.classList.toggle('stick-on', joystick);
  const st = document.getElementById('stick');
  if (st) {
    st.classList.toggle('ligero', stickModo === 'ligero');
    const knob = document.getElementById('stickKnob');
    if (knob) knob.style.backgroundImage = stickModo === 'bola' ? `url(${bolaURL()})` : 'none';
  }
  const eti = document.getElementById('pmStick');
  if (eti) eti.textContent = stickModo === 'bola' ? TP.bola
                           : stickModo === 'ligero' ? TP.ligero : TP.cruceta;
  const ef = document.getElementById('pmFuego');
  if (ef) ef.textContent = fuegoOn ? TP.si : TP.no;
  const ea = document.getElementById('pmAuto');
  if (ea) ea.textContent = autoguardado ? TP.si : TP.no;
  const ed = document.getElementById('pmDesp');
  if (ed) ed.textContent = quiereDespierto ? (despierto ? TP.si + ' ✓' : TP.si) : TP.no;
  if (joystick) colocarStick(); else soltarTodo();
}
function cambiarStick() {
  stickModo = stickModo === 'bola' ? 'ligero' : stickModo === 'ligero' ? 'cruz' : 'bola';
  const cod = stickModo === 'bola' ? '1' : stickModo === 'ligero' ? '2' : '0';
  try { localStorage.setItem(STICKKEY(), cod); } catch (e) {}
  fetch('/api/padlayout', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ clave: STICKKEY(), pos: { on: +cod } }) }).catch(() => {});
  aplicarStick();
  if (joystick) colocarStick();
  vibrar(20);
  toast(stickModo === 'bola' ? TP.tsBola : stickModo === 'ligero' ? TP.tsLigero : TP.tsCruz, 1800);
}
setTimeout(aplicarStick, 900);


/* ================= HADOUKEN: FUEGO DE VERDAD =================
   Detectamos el cuarto de círculo (abajo, abajo-delante, delante) seguido de puñetazo,
   venga del joystick o de la cruceta, y soltamos una bola de fuego con partículas.
   Todo en un lienzo aparte con mezcla aditiva: núcleo blanco, llamas, chispas y humo. */
const FUEGO = (() => {
  let cv, ctx, dpr = 1, corriendo = false;
  const parts = [];
  const ondas = [];
  let sprites = null;

  /* Piezas del joystick saltando por los aires: un muelle y una tuerca dibujados
     a mano, que al nivel bestia se ve que el mando se está desarmando. */
  function pieza(cual) {
    const c = document.createElement('canvas');
    c.width = c.height = 48;
    const g = c.getContext('2d');
    g.lineCap = 'round';
    if (cual === 'muelle') {
      for (const [col, ancho, dx] of [['rgba(20,20,26,.9)', 5, 1], ['#b9c2d4', 3, 0], ['#f2f6ff', 1.2, -.6]]) {
        g.strokeStyle = col; g.lineWidth = ancho;
        g.beginPath();
        for (let i = 0; i <= 40; i++) {
          const t = i / 40, y = 6 + t * 36;
          const x = 24 + Math.sin(t * Math.PI * 5) * 9 + dx;
          i ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        g.stroke();
      }
    } else {
      g.translate(24, 24);
      g.strokeStyle = 'rgba(15,15,20,.9)'; g.lineWidth = 5;
      g.fillStyle = '#98a3b8';
      g.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3, x = Math.cos(a) * 13, y = Math.sin(a) * 13;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.closePath(); g.stroke(); g.fill();
      g.strokeStyle = '#e6ecf7'; g.lineWidth = 1.4; g.stroke();
      g.globalCompositeOperation = 'destination-out';
      g.beginPath(); g.arc(0, 0, 5.5, 0, 7); g.fill();
    }
    return c;
  }

  function hacerSprites() {
    // pre-dibujamos las manchas: pintar degradados por partícula y fotograma iría a pedales
    const mk = (paradas) => {
      const c = document.createElement('canvas');
      c.width = c.height = 96;
      const g = c.getContext('2d');
      const gr = g.createRadialGradient(48, 48, 0, 48, 48, 48);
      paradas.forEach(([p, col]) => gr.addColorStop(p, col));
      g.fillStyle = gr; g.beginPath(); g.arc(48, 48, 48, 0, 7); g.fill();
      return c;
    };
    return {
      nucleo: mk([[0, 'rgba(255,255,255,1)'], [.28, 'rgba(255,245,200,.95)'],
                  [.6, 'rgba(255,150,40,.5)'], [1, 'rgba(255,80,0,0)']]),
      llama:  mk([[0, 'rgba(255,230,150,.95)'], [.35, 'rgba(255,140,30,.75)'],
                  [.7, 'rgba(220,40,10,.35)'], [1, 'rgba(120,10,0,0)']]),
      brasa:  mk([[0, 'rgba(255,220,120,1)'], [.5, 'rgba(255,110,20,.6)'], [1, 'rgba(255,60,0,0)']]),
      humo:   mk([[0, 'rgba(70,60,58,.55)'], [.6, 'rgba(40,34,34,.3)'], [1, 'rgba(20,16,16,0)']]),
      // versión azul, para cuando encadenas dos bolas
      nucleoAzul: mk([[0, 'rgba(255,255,255,1)'], [.28, 'rgba(205,240,255,.95)'],
                      [.6, 'rgba(70,160,255,.5)'], [1, 'rgba(20,60,255,0)']]),
      llamaAzul:  mk([[0, 'rgba(200,240,255,.95)'], [.35, 'rgba(80,170,255,.75)'],
                      [.7, 'rgba(30,70,220,.35)'], [1, 'rgba(10,20,110,0)']]),
      brasaAzul:  mk([[0, 'rgba(220,245,255,1)'], [.5, 'rgba(90,180,255,.6)'], [1, 'rgba(40,90,255,0)']]),
      // chispa blanca de soldadura, la que hace el ¡crack!
      chispa: mk([[0, 'rgba(255,255,255,1)'], [.25, 'rgba(255,245,220,.9)'],
                  [.6, 'rgba(255,200,120,.35)'], [1, 'rgba(255,160,60,0)']]),
      muelle: pieza('muelle'),
      tuerca: pieza('tuerca')
    };
  }

  function preparar() {
    if (cv) return;
    cv = document.createElement('canvas');
    cv.id = 'fuegoCv';
    cv.style.cssText = 'position:fixed;inset:0;z-index:10003;pointer-events:none;display:none;opacity:.62';
    document.body.appendChild(cv);
    ctx = cv.getContext('2d');
    sprites = hacerSprites();
    medir();
    addEventListener('resize', medir);
  }
  /* El lienzo del fuego ocupa toda la pantalla. Aunque esté transparente, el móvil
     tiene que componerlo en cada fotograma, así que lo escondemos cuando no hay nada. */
  function encender() { if (cv && cv.style.display === 'none') cv.style.display = 'block'; }
  function apagar()   { if (cv) cv.style.display = 'none'; }

  function medir() {
    if (!cv) return;
    dpr = Math.min(1.5, devicePixelRatio || 1);      // de sobra para llamas, y la mitad de píxeles
    cv.width = Math.round(innerWidth * dpr);
    cv.height = Math.round(innerHeight * dpr);
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
  }

  const az = (a, b) => a + Math.random() * (b - a);

  function lanzar(x, y, dir, tipo, azul, nivel) {
    preparar(); encender();
    nivel = nivel || 1;
    const K = Math.max(.85, Math.min(innerWidth, innerHeight) / 390) * (1 + Math.min(nivel, 10) * .06);
    const N = azul ? 'nucleoAzul' : 'nucleo';
    /* En vez de todo azul, mezclamos: azul donde más quema y naranja alrededor */
    const dos = () => (azul && Math.random() < .55) ? { L: 'llamaAzul', B: 'brasaAzul' }
                                                    : { L: 'llama', B: 'brasa' };
    const L = azul ? 'llamaAzul' : 'llama', B = azul ? 'brasaAzul' : 'brasa';
    if (tipo === 'ascenso') return ascenso(x, y, dir, K, azul, nivel);
    const extra = Math.min(nivel, 10);
    // 1) el núcleo: bola brillante que viaja dejando estela (va soltando llama en cada fotograma)
    parts.push({ t: N, x, y, vx: dir * (azul ? 640 : 520) * K, vy: az(-20, 8),
                 vida: azul ? .62 : .5, max: .62, r: (azul ? 104 : 82) * K,
                 giro: 0, estela: true, dir, azul: !!azul });
    // 2) fogonazo de salida: llamarada ancha desde la mano
    for (let i = 0; i < 24 + extra * 6; i++) {
      const ang = az(-.5, .5);
      const v = az(150, 430) * K;
      parts.push({ t: dos().L, x: x + az(-7, 7), y: y + az(-7, 7),
                   vx: dir * Math.cos(ang) * v, vy: Math.sin(ang) * v * .45 - az(0, 50),
                   vida: az(.28, .6), max: .6, r: az(34, 78) * K * (azul ? 1.2 : 1), giro: az(-3, 3) });
    }
    // 3) chispas rápidas con gravedad
    for (let i = 0; i < 16 + extra * 5; i++) {
      const ang = az(-.7, .7);
      const v = az(400, 1000) * K;
      parts.push({ t: dos().B, x, y, vx: dir * Math.cos(ang) * v, vy: Math.sin(ang) * v * .6 - az(60, 200),
                   vida: az(.35, .7), max: .7, r: az(4, 10) * K, g: 900, giro: 0 });
      if (extra >= 4 && i % 3 === 0) {                 // y chispa blanca de propina
        parts.push({ t: 'chispa', x, y, vx: dir * Math.cos(ang) * v * 1.4, vy: Math.sin(ang) * v - az(100, 400),
                     vida: az(.2, .5), max: .5, r: az(3, 8), g: 1200, giro: 0 });
      }
    }
    // 4) un pelín de humo, solo para dar cuerpo (antes tapaba media pantalla)
    for (let i = 0; i < 4; i++) {
      parts.push({ t: 'humo', x: x + az(-10, 10), y: y + az(-10, 10),
                   vx: dir * az(20, 90) * K, vy: -az(30, 90),
                   vida: az(.5, .9), max: .9, r: az(40, 80) * K, giro: az(-1, 1) });
    }
    // 5) onda expansiva y destello de salida
    ondas.push({ x, y, r: 8 * K, vida: .3, max: .3, k: K * .7, azul });
    if (azul) ondas.push({ x, y, r: 8 * K, vida: .5, max: .5, k: K * 1.15, azul: true });
    destello = { x, y, vida: azul ? .2 : .14, max: azul ? .2 : .14, r: (azul ? 230 : 150) * K, azul };
    if (parts.length > 420) parts.splice(0, parts.length - 420);
    if (!corriendo) { corriendo = true; ultimo = performance.now(); requestAnimationFrame(pintar); }
  }

  /* SHORYUKEN: puño hacia arriba. Columna de fuego que sube con un poco de
     deriva hacia delante, en vez de una bola que sale disparada de lado. */
  function ascenso(x, y, dir, K, azul, nivel) {
    const N = azul ? 'nucleoAzul' : 'nucleo', L = azul ? 'llamaAzul' : 'llama', B = azul ? 'brasaAzul' : 'brasa';
    const extra = Math.min(nivel || 1, 10);
    parts.push({ t: N, x, y: y + 10, vx: dir * 130 * K, vy: -560 * K * (1 + extra * .07),
                 vida: .52, max: .52, r: 78 * K, giro: 0, estela: true, dir, sube: true, azul: !!azul });
    for (let i = 0; i < 26 + extra * 7; i++) {
      const ang = az(-.45, .45);
      const v = az(180, 520) * K;
      parts.push({ t: L, x: x + az(-9, 9), y: y + az(-4, 10),
                   vx: dir * az(20, 130) * K + Math.sin(ang) * 60,
                   vy: -v * (1 + extra * .06), vida: az(.3, .62 + extra * .04), max: 1,
                   r: az(32, 74) * K, giro: 0, sube: true });
    }
    for (let i = 0; i < 18 + extra * 4; i++) {
      parts.push({ t: B, x: x + az(-12, 12), y: y + az(-6, 8),
                   vx: dir * az(30, 260) * K + az(-90, 90), vy: -az(500, 1150) * K,
                   vida: az(.4, .8), max: .8, r: az(4, 11) * K, g: 780, giro: 0 });
    }
    for (let i = 0; i < 4; i++) {
      parts.push({ t: 'humo', x: x + az(-10, 10), y: y + az(-6, 6),
                   vx: dir * az(10, 70) * K, vy: -az(60, 130),
                   vida: az(.5, .9), max: .9, r: az(38, 76) * K, giro: 0 });
    }
    ondas.push({ x, y, r: 8 * K, vida: .3, max: .3, k: K * .6 });
    destello = { x, y, vida: .14, max: .14, r: 140 * K };
    if (!corriendo) { corriendo = true; ultimo = performance.now(); requestAnimationFrame(pintar); }
  }

  /* La bola se queda ardiendo unos segundos y la llama sigue al pulgar:
     emitimos desde la posición real de la bola en cada fotograma y usamos
     su velocidad para que el fuego quede rezagado, como una estela. */
  let arde = 0, ardeAzul = false, ardeNivel = 1, bolaX = 0, bolaY = 0, bolaVX = 0, bolaVY = 0, ultBola = 0;
  function arder(ms, azul, nivel) {
    arde = Math.max(arde, performance.now() + ms);
    ardeAzul = azul || false;
    ardeNivel = Math.max(1, Math.min(12, nivel || 1));
    preparar(); encender();
    const k = document.getElementById('stickKnob');
    if (k) {                                   // una llama u otra, nunca las dos a la vez
      k.classList.remove('ardiendo', 'ardiendoAzul');
      k.classList.add(azul ? 'ardiendoAzul' : 'ardiendo');
    }
    if (!corriendo) { corriendo = true; ultimo = performance.now(); requestAnimationFrame(pintar); }
  }
  function emitirLlama(dt, ahora) {
    const k = document.getElementById('stickKnob');
    if (!k) return;
    const r = k.getBoundingClientRect();
    if (!r.width) return;
    const nx = r.left + r.width / 2, ny = r.top + r.height / 2;
    if (ultBola) { bolaVX = (nx - bolaX) / Math.max(.008, dt); bolaVY = (ny - bolaY) / Math.max(.008, dt); }
    bolaX = nx; bolaY = ny; ultBola = ahora;
    const queda = (arde - ahora) / 1000;
    const fuerza = Math.min(1, queda / .8);                    // se va apagando al final
    const rad = r.width * .5;
    const nv = ardeNivel;
    /* MEZCLA: el fuego de verdad es azul en la base (donde más quema) y naranja
       arriba. Así que a partir del nivel 5 emitimos de los dos y queda una llama
       con corazón azul y penacho naranja, en vez de todo azul. */
    const mezcla = (arriba) => {
      if (nv < 5) return { L: 'llama', B: 'brasa' };
      // cerca de la bola casi todo azul; según sube, más naranja
      const pAzul = arriba ? .28 : .78;
      return Math.random() < pAzul ? { L: 'llamaAzul', B: 'brasaAzul' } : { L: 'llama', B: 'brasa' };
    };

    /* Altura que puede alcanzar la llamarada. En horizontal la dejamos llegar arriba
       del todo; en vertical la cortamos al 45% o te taparía el juego. */
    const techo = ny - (HORIZONTAL() ? innerHeight * .96 : innerHeight * .45) * Math.min(1, (nv - 2) / 6);
    const subeHasta = Math.max(0, ny - techo);
    const vSube = subeHasta > 0 ? Math.sqrt(2 * 620 * subeHasta) : 0;

    // fuego base, cada vez más denso
    const n = 2 + Math.round(nv * 1.4);
    for (let i = 0; i < n; i++) {
      const a = az(0, 6.28), d = az(0, rad * .8);
      parts.push({ t: mezcla(false).L, x: nx + Math.cos(a) * d, y: ny + Math.sin(a) * d * .8,
                   vx: -bolaVX * .22 + az(-40, 40) * (1 + nv * .1),
                   vy: -az(90, 230) - Math.abs(bolaVY) * .1 - nv * 26,
                   vida: az(.16, .38 + nv * .03) * fuerza, max: .7,
                   r: az(16, 34) * (1 + nv * .09), giro: 0 });
    }
    // columna que sube de verdad, a partir del nivel 3, con las dos llamas trenzadas
    if (nv >= 3 && vSube > 0) {
      for (let i = 0; i < Math.round(nv * 1.1); i++) {
        const alto = i % 2 === 0;                       // alternamos: unas suben más
        parts.push({ t: mezcla(alto).L, x: nx + az(-rad * .7, rad * .7), y: ny,
                     vx: az(-70, 70) - bolaVX * .1, vy: -vSube * (alto ? az(.85, 1.08) : az(.5, .8)),
                     vida: az(.5, 1), max: 1, r: az(26, 52) * (1 + nv * .07), giro: 0, sube: true });
      }
      if (nv >= 6 && Math.random() < .55) {
        parts.push({ t: ardeAzul ? 'nucleoAzul' : 'nucleo', x: nx + az(-8, 8), y: ny,
                     vx: az(-20, 20), vy: -vSube * az(.8, 1.1),
                     vida: az(.35, .6), max: .6, r: az(28, 46), giro: 0, sube: true });
      }
    }
    // chispas de las dos clases
    const chispas = nv >= 3 ? Math.min(1, .25 + nv * .12) : (ardeAzul ? .5 : .3);
    if (Math.random() < chispas) {
      for (let i = 0; i < 1 + Math.floor(nv / 3); i++) {
        parts.push({ t: mezcla(true).B, x: nx + az(-10, 10), y: ny,
                     vx: -bolaVX * .3 + az(-140, 140) * (1 + nv * .12),
                     vy: -az(200, 460) - nv * 60,
                     vida: az(.3, .7), max: .7, r: az(3, 8 + nv * .5), g: 520, giro: 0, sube: true });
      }
    }
    // chispas blancas de soldadura: rápidas, finas y con rebote
    if (nv >= 4 && Math.random() < .35 + nv * .05) {
      for (let i = 0; i < 1 + Math.floor(nv / 4); i++) {
        const a = az(-2.6, -.5);
        const v = az(500, 1500) + nv * 90;
        parts.push({ t: 'chispa', x: nx + az(-6, 6), y: ny + az(-6, 6),
                     vx: Math.cos(a) * v * az(.5, 1) * (Math.random() < .5 ? 1 : -1),
                     vy: Math.sin(a) * v, g: 1400,
                     vida: az(.25, .6), max: .6, r: az(3, 9), giro: 0 });
      }
    }
    // ¡y los muelles y tuercas del joystick! esto ya es que lo has reventado
    if (nv >= 7 && Math.random() < .1 + (nv - 7) * .05) {
      const cual = Math.random() < .55 ? 'muelle' : 'tuerca';
      parts.push({ t: cual, x: nx + az(-10, 10), y: ny - 6,
                   vx: az(-420, 420), vy: -az(600, 1150),
                   rot: az(0, 6.28), vrot: az(-14, 14),
                   vida: az(1.1, 1.9), max: 1.9, r: az(20, 34) });
    }
    // humillo cuando ya va muy caliente
    if (nv >= 5 && Math.random() < .12) {
      parts.push({ t: 'humo', x: nx + az(-14, 14), y: ny - 10,
                   vx: az(-40, 40), vy: -az(60, 150),
                   vida: az(.7, 1.3), max: 1.3, r: az(40, 90), giro: 0 });
    }
    if (ahora > arde) {
      arde = 0;
      k.classList.remove('ardiendo', 'ardiendoAzul');
    }
  }

  let ultimo = 0, destello = null;
  function pintar(ahora) {
    const dt = Math.min(.05, (ahora - ultimo) / 1000); ultimo = ahora;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    if (arde) emitirLlama(dt, ahora);
    // el núcleo va dejando llama por donde pasa: eso es lo que da el aspecto de bola de fuego
    for (const p of parts) {
      if ((p.t !== 'nucleo' && p.t !== 'nucleoAzul') || !p.estela || p.vida <= 0) continue;
      for (let i = 0; i < 2; i++) {
        const dx = p.sube ? az(-8, 8) : -p.dir * az(0, 18) + az(-6, 6);
        const dy = p.sube ? az(4, 26) : az(-9, 9);
        parts.push({ t: p.azul ? 'llamaAzul' : 'llama', x: p.x + dx, y: p.y + dy,
                     vx: p.sube ? az(-60, 60) : -p.dir * az(20, 110) + p.vx * .1,
                     vy: p.sube ? az(20, 140) : az(-70, 70),
                     vida: az(.14, .32), max: .32, r: az(28, 62), giro: 0 });
      }
    }

    // humo primero, por debajo del fuego
    ctx.globalCompositeOperation = 'source-over';
    dibujar('humo', dt);
    // y el fuego con mezcla aditiva, que es lo que da el brillo bueno
    ctx.globalCompositeOperation = 'lighter';
    dibujar('llama', dt); dibujar('llamaAzul', dt);
    dibujar('brasa', dt); dibujar('brasaAzul', dt);
    dibujar('chispa', dt);
    dibujar('orbe', dt);
    dibujar('nucleo', dt); dibujar('nucleoAzul', dt);
    // las piezas del mando no brillan, se ven macizas: van aparte y por encima
    ctx.globalCompositeOperation = 'source-over';
    dibujarPiezas(dt);
    ctx.globalCompositeOperation = 'lighter';

    // destello de salida
    if (destello) {
      destello.vida -= dt;
      if (destello.vida <= 0) destello = null;
      else {
        const a = destello.vida / destello.max;
        const gr = ctx.createRadialGradient(destello.x, destello.y, 0, destello.x, destello.y, destello.r);
        if (destello.azul) {
          gr.addColorStop(0, `rgba(232,248,255,${a * .6})`);
          gr.addColorStop(.4, `rgba(90,180,255,${a * .26})`);
          gr.addColorStop(1, 'rgba(20,70,255,0)');
        } else {
          gr.addColorStop(0, `rgba(255,246,220,${a * .5})`);
          gr.addColorStop(.4, `rgba(255,170,60,${a * .2})`);
          gr.addColorStop(1, 'rgba(255,90,0,0)');
        }
        ctx.fillStyle = gr;
        ctx.fillRect(destello.x - destello.r, destello.y - destello.r, destello.r * 2, destello.r * 2);
      }
    }
    // ondas expansivas
    for (let i = ondas.length - 1; i >= 0; i--) {
      const o = ondas[i];
      o.vida -= dt; o.r += 1150 * (o.k || 1) * dt;
      if (o.vida <= 0) { ondas.splice(i, 1); continue; }
      const a = o.vida / o.max;
      ctx.strokeStyle = o.azul ? `rgba(${120 + 110 * a | 0},210,255,${a * .34})`
                                : `rgba(255,${140 + 90 * a | 0},60,${a * .28})`;
      ctx.lineWidth = 1.5 + 4 * a;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';

    // limpiar los muertos
    for (let i = parts.length - 1; i >= 0; i--) if (parts[i].vida <= 0) parts.splice(i, 1);
    if (parts.length || ondas.length || destello || arde) requestAnimationFrame(pintar);
    else { corriendo = false; ctx.clearRect(0, 0, innerWidth, innerHeight); apagar(); }
  }

  function dibujarPiezas(dt) {
    for (const p of parts) {
      if (p.t !== 'muelle' && p.t !== 'tuerca') continue;
      p.vida -= dt;
      if (p.vida <= 0) continue;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 1500 * dt;                       // el hierro cae rápido
      p.vx *= .995;
      p.rot += p.vrot * dt;
      const a = p.vida / p.max;
      ctx.globalAlpha = Math.min(1, a * 2.2);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.drawImage(sprites[p.t], -p.r / 2, -p.r / 2, p.r, p.r);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function dibujar(tipo, dt) {
    const base = tipo.replace('Azul', '');
    for (const p of parts) {
      if (p.t !== tipo) continue;
      p.vida -= dt;
      if (p.vida <= 0) continue;
      if (p.t === 'orbe') {                       // chispas que giran alrededor de la bola
        p.ang += p.vel * dt;
        p.x = (bolaX || p.cx) + Math.cos(p.ang) * p.rad;
        p.y = (bolaY || p.cy) + Math.sin(p.ang) * p.rad * .55;
        const a0 = p.vida / p.max;
        ctx.globalAlpha = Math.min(1, a0 * 1.4);
        const t0 = p.r * (.5 + a0 * .7);
        ctx.drawImage(sprites[p.azul ? 'brasaAzul' : 'brasa'], p.x - t0 / 2, p.y - t0 / 2, t0, t0);
        continue;
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += (p.g || (base === 'humo' ? -70 : (p.sube ? 620 : 240))) * dt;  // lo lanzado hacia arriba frena y cae
      p.vx *= (base === 'brasa' ? .985 : .94);
      p.vy *= .97;
      const a = p.vida / p.max;
      const tam = base === 'nucleo' ? p.r * (.75 + a * .5)
                : p.r * (base === 'humo' ? (1.7 - a * .8) : (.3 + a * .95));
      ctx.globalAlpha = base === 'humo' ? a * .45 : Math.min(1, base === 'nucleo' ? a * 1.8 : a * 1.3);
      if (base === 'nucleo') {                       // doble pasada: el corazón blanco quema más
        ctx.drawImage(sprites.nucleo, p.x - tam / 2, p.y - tam / 2, tam, tam);
        ctx.drawImage(sprites.nucleo, p.x - tam / 4, p.y - tam / 4, tam / 2, tam / 2);
      }
      ctx.drawImage(sprites[tipo], p.x - tam / 2, p.y - tam / 2, tam, tam);
    }
    ctx.globalAlpha = 1;
  }

  return { lanzar, preparar, arder, orbes: (n, azul) => {
    const k = document.getElementById('stickKnob');
    if (!k) return;
    const r = k.getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      parts.push({ t: 'orbe', ang: (i / n) * 6.28, vel: az(3.4, 5), rad: r.width * az(.75, 1.15),
                   cx: r.left + r.width / 2, cy: r.top + r.height / 2,
                   vida: 2.6, max: 2.6, r: az(9, 16), azul: !!azul });
    }
  } };
})();

/* --- detector del cuarto de círculo + puñetazo --- */
let fuegoOn = true;
try { fuegoOn = localStorage.getItem('sala_fuego') !== '0'; } catch (e) {}
const DIRIDX = { 4: 'arriba', 5: 'abajo', 6: 'izq', 7: 'der' };
const BOTONES = [0, 1, 8, 9];                  // solo los botones de la cara (nada de L y R)
const estadoDir = { arriba: 0, abajo: 0, izq: 0, der: 0 };
let historia = [], armaFuego = null, ultimoFuego = 0, ultimoTipo = '';

/* ---------- CALOR: cuantos más especiales encadenes, más arde el mando ----------
   La racha sube con cada bola o shoryuken si no tardas más de 7 s en el siguiente,
   y el calor baja solito. En vertical se limita la altura de las llamas, que si no
   te tapan media pantalla. */
let racha = 0, ultimoEspecial = 0;
const HORIZONTAL = () => { try { return matchMedia('(orientation: landscape)').matches; } catch (e) { return innerWidth > innerHeight; } };
function subirCalor() {
  const t = performance.now();
  racha = (t - ultimoEspecial < 7000) ? racha + 1 : 1;
  ultimoEspecial = t;
  return racha;
}
setInterval(() => {
  if (racha && performance.now() - ultimoEspecial > 7000) {
    racha = 0;
    const st = document.getElementById('stick');
    if (st) st.classList.remove('temblando', 'temblandoMucho');
    const c = document.getElementById('comboBox');
    if (c) c.classList.remove('on');
  }
}, 500);

/* cartelito de racha, estilo recreativa */
function pintarRacha(n) {
  let c = document.getElementById('comboBox');
  if (!c) {
    c = document.createElement('div');
    c.id = 'comboBox';
    document.body.appendChild(c);
  }
  const titulos = ['', '', 'CALENTANDO', 'EN LLAMAS', 'ARDIENDO', 'INFERNO',
                   'FUERA DE CONTROL', 'EL MANDO PIDE AGUA', 'ESTO YA NO ES LEGAL',
                   'DIOS DEL JOYSTICK'];
  const t = titulos[Math.min(n, titulos.length - 1)];
  c.innerHTML = `<b>×${n}</b>` + (t ? `<i>${t}</i>` : '');
  c.className = 'on n' + Math.min(n, 10);
  clearTimeout(window._combo);
  window._combo = setTimeout(() => c.classList.remove('on'), 2600);
  // el mando tiembla de verdad cuando te pasas de frenada
  const st = document.getElementById('stick');
  if (st) {
    st.classList.toggle('temblando', n >= 4 && n < 8);
    st.classList.toggle('temblandoMucho', n >= 8);
  }
}

function octante() {
  const v = (estadoDir.abajo ? 'abajo' : estadoDir.arriba ? 'arriba' : '');
  const h = (estadoDir.der ? 'der' : estadoDir.izq ? 'izq' : '');
  return (v + (v && h ? '-' : '') + h) || 'centro';
}
function verDireccion() {
  const o = octante(), t = performance.now();
  if (historia.length && historia[historia.length - 1].o === o) return;
  historia.push({ o, t });
  if (historia.length > 12) historia.shift();
  detectarGesto();
}

/* Recorremos el historial hacia atrás desde la posición actual.
   Perdonamos los parpadeos por el centro (al rodar el pulgar la zona muerta
   suelta un instante) y no exigimos que el gesto empiece desde parado:
   si vienes andando hacia delante también cuenta. */
function detectarGesto() {
  const n = historia.length;
  if (!n) return;
  const cur = historia[n - 1], t = cur.t;

  for (const [diag, frente, dir] of [['abajo-der', 'der', 1], ['abajo-izq', 'izq', -1]]) {

    // ---- HADOUKEN: abajo, (abajo-delante), delante ----
    if (cur.o === frente) {
      let vioAbajo = false;
      for (let i = n - 2; i >= 0; i--) {
        const h = historia[i];
        if (t - h.t > 460) break;                 // el cuarto de círculo tiene que ser rápido
        if (h.o === diag || h.o === 'centro') continue;
        if (h.o === 'abajo') { vioAbajo = true; }
        break;
      }
      if (vioAbajo) { armaFuego = { dir, t, tipo: 'bola' }; return; }
    }

    // ---- SHORYUKEN: delante, abajo, abajo-delante ----
    if (cur.o === diag) {
      let vioAbajo = false, vioFrente = false;
      for (let i = n - 2; i >= 0; i--) {
        const h = historia[i];
        if (t - h.t > 620) break;
        if (h.o === 'centro') continue;
        if (h.o === 'abajo') { vioAbajo = true; continue; }
        if (h.o === frente && vioAbajo) { vioFrente = true; }
        break;
      }
      if (vioAbajo && vioFrente) { armaFuego = { dir, t, tipo: 'ascenso' }; return; }
    }
  }
}

function verBoton(idx, valor) {
  if (!fuegoOn || !valor || !armaFuego) return;
  /* en partida en red ni de broma: el canvas de partículas a pantalla completa
     roba justo los fotogramas que el lockstep no puede perder */
  try { if (window.EJS_emulator && window.EJS_emulator.isNetplay) return; } catch (e) {}
  const t = performance.now();
  if (t - armaFuego.t > 330 || t - ultimoFuego < 900) return;       // ventana corta y sin repetir
  // hay que seguir manteniendo la dirección final: así es como se lanza de verdad
  const frente = armaFuego.dir > 0 ? estadoDir.der : estadoDir.izq;
  const manteniendo = armaFuego.tipo === 'ascenso' ? (frente || estadoDir.abajo) : frente;
  if (!manteniendo) return;
  ultimoFuego = t;
  const dir = armaFuego.dir, tipo = armaFuego.tipo;
  armaFuego = null; historia = [];
  // ¿dos bolas seguidas? eso es combo: fuego azul y la bola arde más rato
  const combo = tipo === 'bola' && ultimoTipo === 'bola' && (t - ultimoFuego) < 2600;
  ultimoTipo = tipo;
  // sale de la mano: desde el joystick (o la cruceta) hacia delante
  const el = document.getElementById('stick') ||
             document.querySelector('.ejs_virtualGamepad_left') ||
             document.querySelector('canvas.ejs_canvas');
  let x = innerWidth * .25, y = innerHeight * .62;
  if (el) { const r = el.getBoundingClientRect(); if (r.width) { x = r.left + r.width / 2; y = r.top + r.height / 2; } }
  const nivel = subirCalor();
  const azul = nivel >= 5;                      // a partir de cinco, fuego azul de verdad
  FUEGO.lanzar(x, y, dir, tipo, azul, nivel);
  if (nivel >= 2) pintarRacha(nivel);
  // arde más rato y más fuerte según la racha; a partir de 3 no se apaga entre golpes
  const rato = nivel >= 3 ? 5000 + nivel * 900 : (Math.random() < .45 ? 3600 : 0);
  if (rato) FUEGO.arder(rato, azul, nivel);
  if (nivel >= 3) FUEGO.orbes(Math.min(3 + nivel, 12), azul);
  // la vibración también escala
  if (nivel >= 8)      vibrar([40, 30, 40, 30, 40, 30, 40, 30, 160]);
  else if (nivel >= 5) vibrar([30, 40, 30, 40, 30, 40, 110]);
  else if (nivel >= 3) vibrar([25, 35, 25, 35, 80]);
  else vibrar(tipo === 'ascenso' ? [18, 24, 22, 24, 70] : [25, 30, 60]);
}

/* enganchamos la entrada del emulador: así funciona con joystick, cruceta y mando físico */
function engancharFuego() {

  const gm = em.gameManager;
  const orig = gm.simulateInput.bind(gm);
  gm.simulateInput = (jugador, idx, valor) => {
    if (ESPIAR) return;                        // en el palco se mira, no se toca
    try {

    } catch (e) { console.warn('[sala200] fallo en el detector de gestos:', e); }

}

/* ================= SONIDO TRAS GRABAR =================
   Al grabar, iOS pone la sesión en "modo llamada" y saca el sonido flojo.
   No vuelve solo: hay que empujarlo de vuelta a modo reproducción. */
/* --- 1. Sesión de audio de iOS ---
   Al grabar, el sistema pasa a 'play-and-record': baja el volumen y saca el sonido
   por el auricular de llamadas. No vuelve solo; hay que pedirle 'playback' a mano. */
function sesionAudio(tipo) {
  try { if (navigator.audioSession) { navigator.audioSession.type = tipo; return true; } } catch (e) {}
  return false;
}

/* --- 2. Todos los contextos de audio, fichados ---
   Suspender y reanudar un contexto obliga a iOS a recalcular por dónde saca el sonido.
   Hay que parchear ANTES de que el emulador cree el suyo. */
const CTXS = [];
['AudioContext', 'webkitAudioContext'].forEach(n => {
  const Orig = window[n];
  if (!Orig || Orig._sala) return;
  const P = function (...a) { const c = new Orig(...a); CTXS.push(c); return c; };
  P.prototype = Orig.prototype; P._sala = true;
  try { window[n] = P; } catch (e) {}
});
function contextos() {
  const l = CTXS.slice();
  try { const m = window.Module; if (m && m.SDL2 && m.SDL2.audioContext) l.push(m.SDL2.audioContext); } catch (e) {}
  try { const em = window.EJS_emulator; if (em && em.audioContext) l.push(em.audioContext); } catch (e) {}
  return l.filter((c, i, a) => c && a.indexOf(c) === i);
}

/* --- 3. Silencio de verdad ---
   El WAV que usaba antes tenía CERO muestras: el navegador ni lo reproducía,
   así que el empujón para cambiar de ruta no llegaba a ocurrir nunca. */
function wavSilencio(ms) {
  const sr = 8000, n = Math.round(sr * ms / 1000), buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const txt = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  txt(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); txt(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  txt(36, 'data'); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
const URL_SILENCIO = wavSilencio(400);
/* recordamos el último volumen REAL (mayor que cero) para poder devolverlo sin equivocarnos */
let volBueno = 0.7;
setInterval(() => {
  const em = window.EJS_emulator;
  if (em && typeof em.volume === 'number' && em.volume > 0.02) volBueno = em.volume;
}, 1000);

/* El emulador guarda {volume, muted} en el navegador y lo reaplica al arrancar.
   Si alguna vez quedó "muted", el juego arranca mudo PARA SIEMPRE. Lo desactivamos. */
function limpiarAjustesAudio() {
  try {
    const raw = localStorage.getItem('ejs-settings');
    const o = raw ? JSON.parse(raw) : {};
    const roto = (o.muted === true) || !(o.volume > 0.02);
    o.muted = false;
    if (!(o.volume > 0.02)) o.volume = 0.7;
    localStorage.setItem('ejs-settings', JSON.stringify(o));
    if (roto) volBueno = o.volume;
    return roto;
  } catch (e) { return false; }
}
limpiarAjustesAudio();   // antes de que cargue el emulador

/* Ojo con setVolume del emulador: hace this.muted = (t === 0).
   Por eso NUNCA hay que pasarle cero "de paso", y hay que quitar el mute a mano. */
function forzarSonido() {
  const em = window.EJS_emulator;
  if (!em) return false;
  try {
    let v = (typeof em.volume === 'number' && em.volume > 0.02) ? em.volume : volBueno;
    if (!(v > 0.02)) v = 0.7;
    em.volume = v;
    em.muted = false;
    if (typeof em.setVolume === 'function') em.setVolume(v);
    em.muted = false;                 // setVolume lo recalcula: nos aseguramos
    volBueno = v;
    return true;
  } catch (e) { return false; }
}
function restaurarSonido(intenso) {
  const paso = (reciclar) => {
    // 1) pedirle al sistema que vuelva a modo reproducción
    sesionAudio('playback');
    // 2) reproducir audio REAL por un elemento normal: es lo que cambia la ruta de salida
    try {
      const a = new Audio(URL_SILENCIO);
      a.volume = 1;
      a.setAttribute('playsinline', '');
      const pr = a.play();
      if (pr && pr.then) pr.catch(() => {});
    } catch (e) {}
    // 3) los contextos dormidos, despiertos; y si toca, un ciclo para que iOS recalcule la salida
    contextos().forEach(c => {
      try {
        if (reciclar && c.state === 'running') { c.suspend().then(() => c.resume()).catch(() => {}); }
        else if (c.state !== 'running') { c.resume().catch(() => {}); }
      } catch (e) {}
    });
    // 4) quitar el silencio y devolver el volumen bueno
    forzarSonido();
  };
  paso(false);
  if (intenso) {
    setTimeout(() => paso(true), 250);          // el ciclo, una vez y con la grabación ya cerrada
    [700, 1400, 2500, 4000].forEach(t => setTimeout(() => paso(false), t));
  } else {
    [300, 900].forEach(t => setTimeout(() => paso(false), t));
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) restaurarSonido(); });
/* el emulador aplica sus ajustes guardados al terminar de cargar: le quitamos el mute después */

function npPito(freqs, dur, vol) {
  try {
    const A = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = A.currentTime, st = dur / freqs.length;

      const o = A.createOscillator(), g = A.createGain(), t = t0 + i * st;
      o.type = 'square'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .07, t + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t + st);
      o.connect(g); g.connect(A.destination); o.start(t); o.stop(t + st + .02);
    });
    setTimeout(() => A.close(), (dur + .3) * 1000);
  } catch (e) {}
}

    const claves = Object.keys(salas || {})

/* ================= NETPLAY EN SERIO: LOCKSTEP =================

   autor lo marca experimental): el invitado ni aplica sus propios botones y
   cada lado ejecuta los inputs en frames distintos. Lo sustituimos entero:

   - Al entrar el 2º jugador, el anfitrión manda un savestate y los dos
     arrancan desde el mismo punto exacto.
   - Después solo viajan botones: cada lado ejecuta EXACTAMENTE los mismos
     inputs en los mismos frames, con RETARDO frames de margen (~83 ms).
   - Si faltan los inputs del otro (lag), el juego se pausa solo y se reanuda
     en cuanto llegan. Si algo se atasca de verdad, se re-sincroniza con un
     savestate nuevo sin que haya que tocar nada. */
/* margen base en frames (a 60fps, 5f ≈ 83 ms de input lag). Ajustable para
   experimentar: localStorage.setItem('sala_retardo','4') en consola y recargar. */
const RETARDO = Math.max(3, Math.min(8, parseInt(localStorage.getItem('sala_retardo') || '5', 10) || 5));
/* El vigilante de desincronización solo tiene sentido en N64: su core diverge de
   verdad. En SNES y compañía los savestates traen detalles que difieren entre
   máquinas sin que la partida esté rota, y daba falsos positivos: resincronizaba
   cada 30 s y salía "¡PARTIDA SINCRONIZADA!" sin parar. */
const CHK_ON = (sys === 'n64');
const RETARDO_MAX = 10;            // techo del margen adaptativo (~166 ms)
const L = {
  on: false,                       // lockstep en marcha
  hs: false,                       // handshake (envío de estado) en curso
  init: 0,                         // frame bruto del emulador en el arranque común
  pend: [],                        // botones míos aún sin mandar (los de este frame)
  mios: {}, suyos: {},             // inputs por frame: {nºframe: [[jugador,botón,valor],...]}
  ultimoRemoto: -1,                // último nº de frame recibido del otro (llegan en orden)
  esperando: null,                 // frame que no podemos ejecutar por falta de inputs
  gen: 0,                          // nº de sincronización: descarta mensajes rezagados de la anterior
  fAnt: 0,                         // último frame ya procesado por lkTick
  d: RETARDO,                      // margen ACTUAL: sube solo si la conexión lo pide (nunca baja en partida)
  stalls: [],                      // parones recientes, para decidir cuándo subir el margen
  tEspera: 0, tEstado: 0, tPedido: 0, tRoto: 0,
  cola: [], v2: false,             // batching: 2 frames por mensaje (si el rival lo habla)
  chkF: 1800, chkMios: {}, chkSuyos: {},   // huellas del estado para pillar desyncs
  chkOcupado: false,               // sacando huella: nadie reanuda hasta terminar
  tSubida: 0,                      // última vez que subió el margen (para poder bajarlo)
  tPing: 0, rtt: 0,                // medición de ida y vuelta con el rival
  pc: null, dc: null, p2p: false,  // canal DIRECTO con el rival (WebRTC), sin pasar por la Pi
  afk: 0,                          // el rival avisó de que salía un momento (wasap...)
  tEstadoMax: 8000                 // paciencia con el envío del estado (según su tamaño)
};
function lkRaw(em) { return parseInt(em.gameManager.getFrameNum()) || 0; }
function lkReset() {
  L.on = false; L.hs = false; L.pend = []; L.fAnt = 0; L.stalls = []; L.afk = 0;
  L.cola = [];                     // ojo: L.v2 NO se limpia aquí: es por rival, se olvida en lkParar
  L.chkF = 1800; L.chkMios = {}; L.chkSuyos = {}; L.chkOcupado = false;
  L.mios = {}; L.suyos = {}; L.ultimoRemoto = -1; L.esperando = null;
}
function lkEnviarSocket(em, m) { try { em.netplay.socket.emit('data-message', m); } catch (e) {} }
/* Los botones viajan por DOS caminos a la vez: el socket (que pasa por el túnel
   y la Pi, y alimenta al palco) y el canal directo con el rival, que suele llegar
   bastante antes. Aplicar dos veces los mismos inputs es inofensivo: para cada
   frame se guarda el mismo contenido. Nos quedamos de facto con el más rápido. */
function lkEnviar(em, m) {
  const directo = L.p2p && L.dc && L.dc.readyState === 'open';
  // el ping mide el camino por el que van los botones: si hay atajo, solo por ahí
  if (directo && (m.s2 === 'png' || m.s2 === 'pog')) { try { L.dc.send(JSON.stringify(m)); } catch (e) {} return; }
  lkEnviarSocket(em, m);
  if (L.p2p && L.dc && L.dc.readyState === 'open' &&
      (m.s2 === 'in' || m.s2 === 'in2' || m.s2 === 'png' || m.s2 === 'pog')) {
    try { L.dc.send(JSON.stringify(m)); } catch (e) {}
  }
}
function lkMiIndice(em) { return em.netplay.owner ? 0 : 1; }   // anfitrión = mando 1

/* Aplica los inputs del frame k en el MISMO orden en los dos lados
   (primero anfitrión, luego invitado): eso es lo que mantiene el determinismo. */
function lkAplicar(em, k) {
  const yo = { idx: lkMiIndice(em), q: L.mios[k] || [] };
  const el = { idx: 1 - yo.idx, q: L.suyos[k] || [] };
  const orden = (yo.idx === 0) ? [yo, el] : [el, yo];
  for (const g of orden) for (const i of g.q) {
    try { em.gameManager.functions.simulateInput(i[0], i[1], i[2]); } catch (e) {}
  }
  delete L.mios[k]; delete L.suyos[k];
}

/* Corazón del lockstep: corre al acabar CADA frame emulado. */
/* con batching (v2) los mensajes salen de 2 en 2: la mitad de trabajo de socket
   y la mitad de despertares del hilo en el móvil. OJO: antes de cualquier pausa
   hay que vaciar la cola, o el rival espera un latido que no va a llegar. */
function lkFlush(em) {
  if (L.cola.length) { lkEnviar(em, { s2: 'in2', g: L.gen, p: L.cola }); L.cola = []; }
}
function lkFrame(em, f) {
  // huella del estado cada 1800 frames (~30 s), en el MISMO frame en ambos
  // lados: si no coinciden, las dos realidades han divergido (el kart borracho).
  // OJO: serializar EN CALIENTE pegado al frame reventaba los cores de FBNeo
  // (los Metal Slug a los 30 s clavados); se hace como el handshake: pausa
  // breve, dejar asentar el frame, huella, y seguir. Simétrico en ambos lados.
  if (CHK_ON && L.v2 && f === L.chkF) {
    L.chkF += 1800;
    L.chkOcupado = true;
    em.pause(true);
    setTimeout(() => {
      lkChequeo(em, f);
      L.chkOcupado = false;
      if (L.on && L.esperando == null && !L.afk) { try { em.play(true); } catch (e) {} }
    }, 80);
  }
  // 1) mando mis botones para el frame f+L.d; aunque no haya ninguno,
  //    el mensaje (o su hueco en la cola) es el latido que deja avanzar al otro
  L.mios[f + L.d] = L.pend;
  if (L.v2) {
    L.cola.push([f + L.d, L.pend]);
    if (L.cola.length >= 2) lkFlush(em);
  } else {
    lkEnviar(em, { s2: 'in', g: L.gen, f: f + L.d, k: L.pend });
  }
  L.pend = [];
  // 2) el siguiente frame (f+1) solo corre si ya tenemos los inputs del otro.
  //    Los primeros RETARDO frames van de gracia: nadie programó inputs ahí.
  const falta = f + 1;
  if (falta > RETARDO && L.ultimoRemoto < falta) {
    L.esperando = falta; L.tEspera = Date.now();
    lkFlush(em);                               // que al rival le llegue TODO antes de parar
    lkAtasco(em);
    em.pause(true);
    return;
  }
  lkAplicar(em, falta);
}

/* ---- margen adaptativo ----
   Con el SOR2 se vio en el log: cuando la latencia con el rival supera el margen
   fijo, el juego pausa/reanuda EN CADA FRAME y se arrastra (de 60 a 33 fps) hasta
   "colgarse". Si nos paramos muchas veces seguidas, subimos NUESTRO margen y le
   pedimos al otro que suba el suyo (que es el que a mí me alimenta). Solo se sube:
   bajarlo en mitad de la partida sí podría desincronizar. Se resetea al salir. */
function lkAtasco(em) {
  const t = Date.now();
  L.stalls.push(t);
  while (L.stalls.length && t - L.stalls[0] > 4000) L.stalls.shift();
  if (L.stalls.length >= 6 && L.d < RETARDO_MAX) {
    L.d++;
    L.tSubida = Date.now();
    L.stalls.length = 0;
    lkEnviar(em, { s2: 'lag', g: L.gen });
    console.log('[lockstep] la conexión pide margen: retardo propio a', L.d, 'frames');
  }
}

/* OJO: Module.postMainLoop está MUERTO en los cores modernos (el core lo
   registra una sola vez al arrancar su bucle, antes de que exista el netplay;
   por eso el netplay de fábrica jamás mandó un frame). El bucle del emulador
   va con requestAnimationFrame, así que nos colgamos de ahí: tras cada tick
   miramos si el contador de frames del core ha avanzado. Correr justo después
   del frame, en la misma tarea de JS, mantiene el gating exacto. */
function lkTick() {
  const em = window.EJS_emulator;
  if (!em || !L.on || !em.gameManager) return;
  let f = lkRaw(em) - L.init;
  if (f <= L.fAnt) return;                   // este tick no ha corrido ningún frame
  // si por lo que sea corrieron varios frames, procesamos cada uno en orden
  while (L.fAnt < f && L.on && L.esperando == null) {
    L.fAnt++;
    lkFrame(em, L.fAnt);
  }
}
(() => {
  const rafOrig = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = (cb) => rafOrig((ts) => {
    /* el mando se lee JUSTO antes del frame: así la pulsación entra en el
       mensaje de ESTE frame del lockstep y no espera al siguiente (-1 frame de lag) */
    try { leerMando(); } catch (e) {}
    cb(ts);
    try { lkTick(); } catch (e) {}
    try { if (ESPIAR) espTick(); } catch (e) {}
  });
})();

/* El anfitrión arranca la partida sincronizada: pausa, savestate y a esperar. */
function lkArrancar(em) {
  if (L.hs || L.on) return;
  lkReset(); L.hs = true; L.tEstado = Date.now();
  L.gen = (Date.now() % 1e9) + Math.floor(Math.random() * 1000);
  /* en recreativa, primero quitamos el disclaimer y dejamos correr un poco:
     así el invitado recibe la máquina ya lista, no la pantalla de avisos */
  const esArcade = (sys === 'arcade' || sys === 'neogeo');
  if (esArcade) { try { saltarDisclaimer(); } catch (e) {} }
  const espera = esArcade ? 2200 : 120;
  if (!esArcade) em.pause(true);
  setTimeout(() => {                         // deja asentarse el frame en curso
    if (esArcade) em.pause(true);
    let estado = null;
    try { estado = em.gameManager.getState(); }
    catch (e) { console.warn('[lockstep] no pude sacar el estado:', e); L.hs = false; return; }
    /* Los savestates de N64 son de varios MB: subirlos desde un móvil tarda, y
       reintentar a los 8 s apilaba estados enteros hasta reventar el socket
       (el cuelgue del Mario Kart). Gzip nativo (queda en una fracción) y la
       paciencia del reintento escala con lo que de verdad hay que subir. */
    const mandar = (d, z) => {
      L.tEstadoMax = 8000 + Math.round(d.length / 400);    // ≈400 bytes/ms de subida
      lkEnviar(em, { s2: 'state', g: L.gen, z: z ? 1 : 0, v: 2, d });
      L.tEstado = Date.now();
      console.log('[lockstep] estado enviado:', d.length, 'bytes', z ? '(gzip)' : '');
    };
    if (window.CompressionStream && L.v2 && estado && estado.length > 300000) {
      new Response(new Blob([estado]).stream().pipeThrough(new CompressionStream('gzip')))
        .arrayBuffer().then(b => mandar(new Uint8Array(b), true))
        .catch(() => mandar(estado, false));
    } else {
      mandar(estado, false);
    }
  }, espera);
}

/* Arranque común: a partir de aquí los dos cuentan frames desde cero. */
function lkComenzar(em) {
  const enSala = L.hs || em.isNetplay;
  lkReset();
  if (!enSala) return;
  if (L.d > RETARDO && Date.now() - L.tSubida > 45000) {
    L.d--;                         // la mala racha pasó: recuperamos margen (y con él, respuesta)
    console.log('[lockstep] conexión estable: retardo baja a', L.d, 'frames');
  }
  L.init = lkRaw(em); L.fAnt = 0; L.on = true;
  // el anfitrión propone el canal directo en cuanto la partida arranca
  if (!L.pc) p2pArmar(em, !!(em.netplay && em.netplay.owner));
  if (sys === 'arcade' || sys === 'neogeo') setTimeout(ritualRecreativa, 1200);
  if (!L.avisado) { L.avisado = true; npMostrar(`${TP.npSync}<br><span style="font-size:9px;color:#6fa585">${TP.npDale}</span>`, 'go', 3000); }
  em.play(true);
}

/* Huella rápida del estado: FNV-1a muestreando 1 de cada 13 bytes. No hace
   falta cobertura criptográfica: cuando dos emuladores divergen, la RAM
   diverge a lo ancho y el muestreo lo pilla igual. */
function lkChequeo(em, f) {
  let st = null;
  try { st = em.gameManager.getState(); } catch (e) { return; }
  if (!st || !st.length) return;
  let h = 0x811c9dc5;
  for (let i = 0; i < st.length; i += 13) { h = ((h ^ st[i]) * 0x01000193) >>> 0; }
  if (em.netplay.owner) {
    L.chkMios[f] = h;
    for (const k in L.chkMios) if (+k < f - 4000) delete L.chkMios[k];
    lkCompara(em, f);
  } else {
    lkEnviar(em, { s2: 'chk', g: L.gen, f, h });
  }
}
function lkCompara(em, f) {
  const mia = L.chkMios[f], suya = L.chkSuyos[f];
  if (mia === undefined || suya === undefined) return;   // aún falta una de las dos
  delete L.chkMios[f]; delete L.chkSuyos[f];
  if (mia !== suya) {
    L.chkFallos = (L.chkFallos || 0) + 1;
    console.warn('[lockstep] huella distinta en el frame', f, '· fallo', L.chkFallos);
    if (L.chkFallos < 2) return;          // uno suelto puede ser ruido: esperamos al siguiente
    L.chkFallos = 0;
    npMostrar(TP.npDesync, 'wait', 5000);
    lkReset();
    lkArrancar(em);
  } else {
    L.chkFallos = 0;
  }
}

/* ================= CANAL DIRECTO CON EL RIVAL (WebRTC) =================
   El túnel y la Pi están muy bien para servir la web, pero para los botones
   sobran: cada pulsación cruzaba móvil → borde (Madrid) → Pi → borde → rival.
   Aquí los dos navegadores se conectan DIRECTAMENTE (el socket solo hace de
   casamentero). Si la conexión directa no cuaja, todo sigue por el camino de
   siempre: es un atajo, no un sustituto. */
const ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
function p2pCerrar() {
  try { if (L.dc) L.dc.close(); } catch (e) {}
  try { if (L.pc) L.pc.close(); } catch (e) {}
  L.dc = null; L.pc = null; L.p2p = false;
}
function p2pCanal(em, dc) {
  L.dc = dc;
  dc.onopen = () => {
    L.p2p = true;
    console.log('[lockstep] canal directo con el rival: ABIERTO');
  };
  dc.onclose = () => { L.p2p = false; };
  dc.onmessage = (ev) => {
    try { lkMensaje(em, JSON.parse(ev.data)); } catch (e) {}
  };
}
function p2pArmar(em, ofrezco) {
  if (!window.RTCPeerConnection || L.pc) return;
  try {
    const pc = new RTCPeerConnection({ iceServers: ICE });
    L.pc = pc;
    pc.onicecandidate = (e) => {
      if (e.candidate) lkEnviarSocket(em, { s2: 'ice', c: e.candidate.toJSON() });
    };
    pc.onconnectionstatechange = () => {
      if (['failed', 'closed', 'disconnected'].includes(pc.connectionState)) L.p2p = false;
    };
    if (ofrezco) {
      p2pCanal(em, pc.createDataChannel('lk', { ordered: true }));
      pc.createOffer().then(o => pc.setLocalDescription(o))
        .then(() => lkEnviarSocket(em, { s2: 'sdp', d: pc.localDescription }))
        .catch(() => {});
    } else {
      pc.ondatachannel = (e) => p2pCanal(em, e.channel);
    }
  } catch (e) { L.pc = null; }
}

/* Todo lo que llega del otro jugador pasa por aquí. */
function lkMensaje(em, t) {
  if (!t || !t.s2) return;                   // restos del protocolo viejo: se ignoran
  if (t.s2 === 'emo') {                      // emoji o frase del rival
    try {
      if (t.f) {
        const texto = String(t.f).slice(0, 60);
        mostrarFrase(texto, String(t.e || '').slice(0, 8), String(t.de || 'RIVAL').slice(0, 20));
        decir(texto);                          // y el móvil se la canta en alto
      } else {
        mostrarEmoji(String(t.e || '').slice(0, 8), String(t.de || 'RIVAL').slice(0, 20));
      }
    } catch (e) {}
    return;
  }
  if (t.s2 === 'zzz') {                      // el rival se fue un momento (wasap, llamada)
    L.afk = Date.now();
    try { em.pause(true); } catch (e) {}
    npMostrar(TP.npAfk, 'wait');
    return;
  }
  if (t.s2 === 'wake') {                     // ha vuelto: sincronía fresca y a seguir
    L.afk = 0;
    if (em.netplay.owner) { lkReset(); lkArrancar(em); }
    else if (Date.now() - L.tPedido > 3000) { L.tPedido = Date.now(); lkEnviar(em, { s2: 'resync' }); }
    return;
  }
  if (t.s2 === 'chk') {                      // huella del invitado: compara el anfitrión
    if (t.g !== L.gen || !em.netplay.owner) return;
    L.chkSuyos[t.f] = t.h;
    for (const k in L.chkSuyos) if (+k < t.f - 4000) delete L.chkSuyos[k];
    lkCompara(em, t.f);
    return;
  }
  if (t.s2 === 'sdp') {                      // saludo del canal directo
    const d = t.d;
    if (!d) return;
    if (d.type === 'offer') {
      if (!L.pc) p2pArmar(em, false);
      if (!L.pc) return;
      L.pc.setRemoteDescription(d)
        .then(() => L.pc.createAnswer())
        .then(a2 => L.pc.setLocalDescription(a2))
        .then(() => lkEnviarSocket(em, { s2: 'sdp', d: L.pc.localDescription }))
        .catch(() => {});
    } else if (d.type === 'answer' && L.pc && !L.pc.currentRemoteDescription) {
      L.pc.setRemoteDescription(d).catch(() => {});
    }
    return;
  }
  if (t.s2 === 'ice') {
    try { if (L.pc && t.c) L.pc.addIceCandidate(t.c).catch(() => {}); } catch (e) {}
    return;
  }
  if (t.s2 === 'png') { lkEnviar(em, { s2: 'pog', t: t.t }); return; }   // eco del ping
  if (t.s2 === 'pog') { L.rtt = Date.now() - t.t; return; }               // rtt medido
  if (t.s2 === 'lag') {                      // el rival se atasca esperándome: mando antes
    if (t.g === L.gen && L.d < RETARDO_MAX) {
      L.d++;
      L.tSubida = Date.now();
      console.log('[lockstep] el rival pide margen: retardo propio a', L.d, 'frames');
    }
    return;
  }
  if (t.s2 === 'in' || t.s2 === 'in2') {
    if (t.g !== L.gen) return;               // paquete rezagado de otra sincronización
    if (t.s2 === 'in2') {
      for (const par of (t.p || [])) {
        if (Array.isArray(par[1]) && par[1].length) L.suyos[par[0]] = par[1];
        if (par[0] > L.ultimoRemoto) L.ultimoRemoto = par[0];
      }
    } else {
      if (Array.isArray(t.k) && t.k.length) L.suyos[t.f] = t.k;
      if (t.f > L.ultimoRemoto) L.ultimoRemoto = t.f;
    }
    if (L.on && L.esperando != null && L.ultimoRemoto >= L.esperando) {
      const k = L.esperando; L.esperando = null;
      lkAplicar(em, k);
      if (!L.chkOcupado) em.play(true);   // con huella en curso, reanuda el propio checkpoint
    }
    return;
  }
  if (t.s2 === 'state' && !em.netplay.owner) {      // llega el estado del anfitrión
    lkReset(); L.hs = true; L.gen = t.g; L.tEstado = Date.now();
    L.v2 = (t.v | 0) >= 2;                   // ¿habla batching el anfitrión?
    em.pause(true);
    const cargar = (bytes) => {
      try { em.gameManager.loadState(bytes); }
      catch (e) { console.warn('[lockstep] no pude cargar el estado:', e); L.hs = false; return; }
      lkEnviar(em, { s2: 'ready', g: L.gen, v: 2 });
    };
    const d = new Uint8Array(t.d);
    if (t.z) {
      new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('gzip')))
        .arrayBuffer().then(b => cargar(new Uint8Array(b)))
        .catch(e => { console.warn('[lockstep] no pude descomprimir el estado:', e); L.hs = false; });
    } else {
      cargar(d);
    }
    return;
  }
  if (t.s2 === 'ready' && em.netplay.owner) {
    if (t.g !== L.gen) return;
    L.v2 = (t.v | 0) >= 2;                   // ¿habla batching el invitado?
    lkEnviar(em, { s2: 'go', g: L.gen });
    lkComenzar(em);
    return;
  }
  if (t.s2 === 'go' && !em.netplay.owner) {
    if (t.g !== L.gen) return;
    lkComenzar(em);
    return;
  }
  if (t.s2 === 'resync' && em.netplay.owner) {
    if (L.hs && Date.now() - L.tEstado < (L.tEstadoMax || 5000)) return;   // ya hay un estado en vuelo
    lkReset();
    lkArrancar(em);
  }
}

/* ---------- saltar el disclaimer de MAME ----------
   Los núcleos de MAME arrancan con su pantalla de avisos. Se pasa pulsando
   OK/START. Es global porque hace falta en dos sitios: al arrancar el juego y,
   sobre todo, ANTES de que el anfitrión reparta la partida por red (si no, el
   invitado recibe una foto con el disclaimer puesto y cada uno ve una cosa). */
function saltarDisclaimer() {
  const em = window.EJS_emulator;
  if (!em || !em.gameManager) return;
  const pulsa = (idx) => {
    try {
      em.gameManager.functions.simulateInput(0, idx, 1);
      setTimeout(() => { try { em.gameManager.functions.simulateInput(0, idx, 0); } catch (e) {} }, 90);
    } catch (e) {
      try {
        em.gameManager.simulateInput(0, idx, 1);
        setTimeout(() => { try { em.gameManager.simulateInput(0, idx, 0); } catch (e2) {} }, 90);
      } catch (e2) {}
    }
  };
  [0, 450, 900, 1350].forEach((t, i) => setTimeout(() => pulsa(i % 2 ? 3 : 0), t));
}

function lkParar(em) {
  const iba = L.on || L.hs;
  lkReset();
  p2pCerrar();
  L.afk = 0;
  L.avisado = false;                                     // cartel de sincronía: una vez por sala
  L.v2 = false;                                          // el próximo rival puede hablar otra versión
  L.d = RETARDO;                                         // margen aprendido: solo vale para ESA conexión
  if (iba) { try { em.play(true); } catch (e) {} }       // que el que queda siga jugando
}

/* Vigilante: arranca/re-sincroniza/para según el estado real de la sala. */
setInterval(() => {
  const em = window.EJS_emulator;
  if (!em || !em.netplay || !em.netplay.getUserCount) return;
  if (!em.isNetplay) {
    salaAbierta = false;          // si la sala murió, que un nuevo toque pueda reabrirla
    if (L.on || L.hs) lkParar(em);
    return;
  }
  /* socket muerto (túnel caído, wifi fuera): sin esto te quedabas CLAVADO esperando
     inputs que jamás llegarían. Se corta el lockstep y sigues jugando en local. */
  const sk = em.netplay.socket;
  if (sk && sk.connected === false) {
    if (!L.tRoto) { L.tRoto = Date.now(); return; }
    if (Date.now() - L.tRoto > 4000 && (L.on || L.hs)) {
      lkParar(em);
      try { em.netplay.leaveRoom(); } catch (e) {}       // sala fuera: así el reenganche automático arranca
      npMostrar(TP.npCorte, 'wait', 7000);
    }
    return;
  }
  L.tRoto = 0;
  if (L.on) { try { lkFlush(em); } catch (e) {} }   // nada se queda en la cola más de 1 s
  /* margen a la baja: si llevamos 15 s sin un solo atasco, devolvemos un frame
     (cada uno son 16 ms menos de retardo en tus botones). Es seguro: el margen
     es de cada lado y solo decide con cuánta antelación programo MIS inputs. */
  if (L.on && L.d > RETARDO && !L.stalls.length && Date.now() - L.tSubida > 15000) {
    L.d--;
    L.tSubida = Date.now();
    console.log('[lockstep] conexión fina: retardo baja a', L.d, 'frames');
  }
  if (L.afk) {                                   // el rival está en el wasap: paciencia
    if (Date.now() - L.afk > 120000) {           // 2 min y no vuelve: cada uno a lo suyo
      lkParar(em);
      try { em.netplay.leaveRoom(); } catch (e) {}
      npMostrar(TP.npAfkFin, 'wait', 7000);
    }
    return;
  }
  const n = em.netplay.getUserCount();
  if (L.on && n >= 2 && Date.now() - L.tPing > 5000) {
    L.tPing = Date.now();
    lkEnviar(em, { s2: 'png', t: Date.now() });
  }
  if ((L.on || L.hs) && n < 2) {
    const jugamos = L.on;                                // solo preguntamos si hubo partida de verdad
    lkParar(em);
    if (jugamos) preguntarDuelo();
    return;
  }
  /* invitado esperando un 'go' que se perdió por el camino: el anfitrión tiene su
     propio vigilante, pero el invitado se quedaba pausado PARA SIEMPRE. Soltamos
     el handshake y la rama de abajo pedirá un resync limpio. */
  if (L.hs && !em.netplay.owner && Date.now() - L.tEstado > 8000) L.hs = false;
  if (n >= 2 && !L.on && !L.hs) {                        // en sala pero sin partida sincronizada
    if (em.netplay.owner) lkArrancar(em);
    else if (Date.now() - L.tPedido > 6000) { L.tPedido = Date.now(); lkEnviar(em, { s2: 'resync' }); }
    return;
  }
  if (L.on && L.esperando != null && Date.now() - L.tEspera > 4000) {
    L.tEspera = Date.now();                              // atasco de verdad: savestate nuevo
    if (em.netplay.owner) { lkReset(); lkArrancar(em); }
    else lkEnviar(em, { s2: 'resync' });
    return;
  }
  if (L.hs && em.netplay.owner && Date.now() - L.tEstado > (L.tEstadoMax || 8000)) {
    L.hs = false; lkArrancar(em);                        // el invitado nunca contestó
  }
}, 1000);

/* Salir un momento al wasap ya no mata la partida: se avisa al rival para que
   espere en pausa y, al volver, la sincronía se rehace sola con estado fresco. */
document.addEventListener('visibilitychange', () => {
  const em = window.EJS_emulator;
  if (!em || !em.isNetplay || !(L.on || L.hs)) return;

  }
});

/* ================= EL PALCO: ver una partida en directo =================
   Un espectador es un tercer emulador gemelo: recibe el MISMO savestate y los
   MISMOS botones que se cruzan los jugadores (el relay le espeja el tráfico,
   etiquetando quién envía) y los aplica en los mismos frames. Ni envía inputs
   ni cuenta como jugador: mira. Va unos frames por detrás como colchón. */
const V = {
  on: false, init: 0, fAnt: 0, gen: 0,
  de: [{}, {}],                    // inputs por frame de cada jugador (0=anfitrión)
  u: [-1, -1],                     // último frame anunciado por cada uno
  esperando: null, colch: 4, sock: null, fin: false
};
function espAplicar(em, k) {
  for (let j = 0; j < 2; j++) {
    const cola = V.de[j][k] || [];
    for (const i of cola) {
      try { em.gameManager.functions.simulateInput(i[0], i[1], i[2]); } catch (e) {}
    }
    delete V.de[j][k];
  }
}
function espTick() {
  const em = window.EJS_emulator;
  if (!V.on || !em || !em.gameManager) return;
  const f = (parseInt(em.gameManager.getFrameNum()) || 0) - V.init;
  if (f <= V.fAnt) return;
  while (V.fAnt < f && V.on && V.esperando == null) {
    V.fAnt++;
    const sig = V.fAnt + 1;
    if (Math.min(V.u[0], V.u[1]) < sig && sig > RETARDO) {
      V.esperando = sig;
      em.pause(true);
      return;
    }
    espAplicar(em, sig);
  }
}
function espSigue(em) {
  if (V.esperando != null && Math.min(V.u[0], V.u[1]) >= V.esperando + V.colch) {
    const k = V.esperando; V.esperando = null;
    espAplicar(em, k);
    if (!V.fin) { try { em.play(true); } catch (e) {} }
  }
}
function espMensaje(em, own, t) {
  if (!t || !t.s2) return;
  const j = own ? 0 : 1;
  if (t.s2 === 'state' && own) {               // sincronización fresca del anfitrión
    V.gen = t.g; V.de = [{}, {}]; V.u = [-1, -1]; V.fAnt = 0; V.esperando = null; V.on = false;
    em.pause(true);
    const cargar = (bytes) => {
      try { em.gameManager.loadState(bytes); } catch (e) { return; }
      npMostrar(TP.palcoTune, 'wait');
    };
    const d = new Uint8Array(t.d);
    if (t.z) {
      new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('gzip')))
        .arrayBuffer().then(b => cargar(new Uint8Array(b))).catch(() => {});
    } else cargar(d);
    return;
  }
  if (t.s2 === 'go' && own) {                  // los jugadores arrancan: nosotros también
    if (t.g !== V.gen) return;
    V.init = (parseInt(em.gameManager.getFrameNum()) || 0);
    V.fAnt = 0; V.on = true;
    npMostrar(TP.palcoOn, 'go', 3500);
    try { em.play(true); } catch (e) {}
    return;
  }
  if (t.g !== undefined && t.g !== V.gen) return;
  if (t.s2 === 'in') {
    if (Array.isArray(t.k) && t.k.length) V.de[j][t.f] = t.k;
    if (t.f > V.u[j]) V.u[j] = t.f;
    espSigue(em);
    return;
  }
  if (t.s2 === 'in2') {
    for (const par of (t.p || [])) {
      if (Array.isArray(par[1]) && par[1].length) V.de[j][par[0]] = par[1];
      if (par[0] > V.u[j]) V.u[j] = par[0];
    }
    espSigue(em);
    return;
  }
  if (t.s2 === 'zzz') { npMostrar(TP.palcoPausa, 'wait'); return; }
  if (t.s2 === 'emo' && t.f) {                 // las frases de pique también se ven en el palco
    try { mostrarFrase(String(t.f).slice(0, 60), String(t.e || '').slice(0, 8), String(t.de || '').slice(0, 20)); } catch (e) {}
    return;
  }
  if (t.s2 === 'emo') {
    try { mostrarEmoji(String(t.e || '').slice(0, 8), String(t.de || '').slice(0, 20)); } catch (e) {}
  }
}
function montarPalco() {
  const em = window.EJS_emulator;
  if (!em || !em.started || V.sock) { if (!V.sock) setTimeout(montarPalco, 700); return; }
  if (typeof io !== 'function') { setTimeout(montarPalco, 700); return; }
  em.pause(true);
  npMostrar(TP.palcoBusca, 'wait');
  // la sala se localiza por juego (mismo game_id que usan los jugadores)
  fetch('/list?domain=' + location.host + '&game_id=' + window.EJS_gameID)
    .then(r => r.json()).then(salas => {
      const claves = Object.keys(salas || {});
      const quien = (p.get('host') || '').toLowerCase();
      const ses = claves.find(c => String(salas[c].owner_name || '').toLowerCase() === quien) || claves[0];
      if (!ses) { npMostrar(TP.palcoNadie, 'wait'); return; }
      V.sock = io(location.origin, { path: '/socket.io/' });
      V.sock.on('connect', () => {
        V.sock.emit('espiar', ses, (ok) => {
          if (!ok) { npMostrar(TP.palcoNadie, 'wait'); return; }
          npMostrar(TP.palcoTune, 'wait');
          V.sock.emit('palco-resync');           // que el anfitrión reparta estado
          setTimeout(() => { if (!V.on && !V.fin) V.sock.emit('palco-resync'); }, 8000);
        });
      });
      V.sock.on('palco-msg', (d) => { try { espMensaje(em, !!d.own, d.m); } catch (e) {} });
      V.sock.on('palco-fin', () => {
        V.fin = true; V.on = false;
        try { em.pause(true); } catch (e) {}
        npMostrar(TP.palcoFin, 'wait');
      });
    }).catch(() => npMostrar(TP.palcoNadie, 'wait'));
}
if (ESPIAR) setTimeout(montarPalco, 1500);

/* Enganche: cada vez que EmulatorJS (re)crea su objeto netplay, le colamos
   nuestro motor encima. Los handlers del socket llaman a estas funciones por
   nombre, así que con sobreescribirlas basta. */
function instalarLockstep(em) {
  em.netplay.simulateInput = (p, id, v) => {             // mis botones: a la cola, no al juego
    if (!em.isNetplay || !L.on) return;
    L.pend.push([lkMiIndice(em), id, v]);
  };
  em.netplay.dataMessage = (t) => lkMensaje(em, t);
  em.netplay.sync = () => {                              // lo dispara users-updated en el anfitrión
    if (em.netplay.getUserCount() >= 2) lkArrancar(em); else lkParar(em);
  };
}
setInterval(() => {
  const em = window.EJS_emulator;
  if (!em || em.lockstepPuesto || typeof em.defineNetplayFunctions !== 'function') return;
  const orig = em.defineNetplayFunctions.bind(em);
  em.defineNetplayFunctions = () => { orig(); instalarLockstep(em); };
  if (em.netplay && em.netplay.simulateInput) instalarLockstep(em);  // por si ya estaba creado
  em.lockstepPuesto = true;
}, 500);


/* ================= COLOCAR EL MANDO A TU GUSTO =================
   Mantén pulsado un botón y arrástralo donde quieras. Se guarda por consola
   y por orientación, en fracciones de pantalla, así aguanta cualquier móvil. */
/* La orientación por matchMedia es fiable; innerWidth/innerHeight tardan en actualizarse
   al girar el móvil y nos hacían leer la configuración de la orientación equivocada. */
function orientacion() {
  try { return matchMedia('(orientation: landscape)').matches ? 'h' : 'v'; }
  catch (e) { return innerWidth > innerHeight ? 'h' : 'v'; }
}
const POSKEY = () => `sala_padpos_${sys}_${orientacion()}`;

/* El mando de N64 se rediseñó (A azul, B verde, C amarillas en rombo). Quien ya
   tuviera botones colocados a mano con el mando viejo seguiría viendo aquel lío,
   así que limpiamos esa configuración UNA vez y en todos sus aparatos. */
if (sys === 'n64') {
  try {
    if (localStorage.getItem('sala_n64_rediseno') !== '1') {
      localStorage.setItem('sala_n64_rediseno', '1');
      ['h', 'v'].forEach(o => {
        localStorage.removeItem(`sala_padpos_n64_${o}`);
        fetch('/api/padlayout', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clave: `sala_padpos_n64_${o}`, pos: {} }) }).catch(() => {});
      });
    }
  } catch (e) {}
}
let posiciones = {};
let posTocadas = false;          // ¿ha movido algo el usuario en esta partida?
let layoutPerfil = null;         // lo que hay guardado en tu perfil, por clave
try { posiciones = JSON.parse(localStorage.getItem(POSKEY()) || '{}'); } catch (e) {}
// y la que tengas guardada en tu perfil manda (así te sigue a cualquier aparato)
fetch('/api/padlayout').then(r => r.json()).then(d => {
  layoutPerfil = d.layout || {};
  // guardamos en el navegador TODAS las claves del perfil, no solo la de ahora:
  // así al girar la pantalla ya está lista la otra orientación sin esperar a la red
  Object.entries(layoutPerfil).forEach(([k, v]) => {
    if (k.startsWith('sala_padpos_') && v && Object.keys(v).length)
      localStorage.setItem(k, JSON.stringify(v));
  });
  const st = layoutPerfil[`sala_stick_${sys}`];
  if (st && typeof st.on !== 'undefined') {
    stickModo = st.on === 2 ? 'ligero' : st.on ? 'bola' : 'cruz';
    joystick = stickModo !== 'cruz';
    try { localStorage.setItem(STICKKEY(), String(st.on)); } catch (e) {}
    aplicarStick();
  }
  const mia = layoutPerfil[POSKEY()];
  if (!posTocadas && mia && Object.keys(mia).length) {
    posiciones = mia;
    elementos().forEach(soltarFijado);
    aplicarPosiciones(true);
  }
  if (joystick) colocarStick();
}).catch(() => {});
function guardarEnPerfil() {
  const cuerpo = JSON.stringify({ clave: POSKEY(), pos: posiciones });
  if (layoutPerfil) layoutPerfil[POSKEY()] = posiciones;
  fetch('/api/padlayout', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: cuerpo }).catch(() => {});
}
/* al salir del juego no da tiempo a un fetch normal: sendBeacon sí llega */
function guardarYa() {
  if (!posTocadas) return;
  clearTimeout(window._gp);
  const cuerpo = JSON.stringify({ clave: POSKEY(), pos: posiciones });
  try {
    if (navigator.sendBeacon &&
        navigator.sendBeacon('/api/padlayout', new Blob([cuerpo], { type: 'application/json' }))) return;
  } catch (e) {}
  guardarEnPerfil();
}
addEventListener('pagehide', guardarYa);
addEventListener('visibilitychange', () => { if (document.hidden) guardarYa(); });
let modoColocar = false, arrastrando = null;
if (p.get('resetpad') === '1') {
  Object.keys(localStorage).filter(k => k.startsWith('sala_padpos_')).forEach(k => localStorage.removeItem(k));
  localStorage.removeItem('sala_padscale');
